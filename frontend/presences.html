<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Présences en ligne - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-5">
        <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-2xl md:text-3xl text-slate-800">Présences en ligne</h1>
                <p class="text-sm text-slate-500 mt-1">Personnes actives dans les dernières minutes. La liste se met à jour toute seule.</p>
            </div>
            <button id="btnActualiser" class="text-sm font-medium px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50">Actualiser</button>
        </div>

        <section class="grid grid-cols-3 gap-3" id="resume"></section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead><tr class="border-b border-slate-200 text-slate-500 text-xs uppercase">
                        <th class="py-2 pr-3">Nom</th><th class="py-2 pr-3">Profil</th><th class="py-2 pr-3">Identifiant</th>
                        <th class="py-2 pr-3">Connecté depuis</th><th class="py-2">Dernière activité</th>
                    </tr></thead>
                    <tbody id="tablePresences"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', admin: true, page: 'presences' });
            document.getElementById('btnActualiser').addEventListener('click', charger);
            charger();
            setInterval(charger, 15000);
        });

        async function charger() {
            const r = await appelApi('/admin/presences');
            const liste = r && r.success ? r.data : [];
            const agents = liste.filter(p => p.type === 'AGENT').length;
            const carte = (n, t) => `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4"><div class="text-2xl font-semibold text-slate-800">${n}</div><div class="text-xs text-slate-500">${t}</div></div>`;
            document.getElementById('resume').innerHTML = carte(liste.length, 'en ligne') + carte(agents, 'agents') + carte(liste.length - agents, 'délégués');
            const corps = document.getElementById('tablePresences');
            if (!liste.length) { corps.innerHTML = `<tr><td colspan="5">${etatVide('Personne n\'est en ligne.')}</td></tr>`; return; }
            corps.innerHTML = liste.map(p => `
                <tr class="border-b border-slate-100">
                    <td class="py-2 pr-3 font-medium text-slate-800"><span class="inline-block w-2 h-2 rounded-full mr-2" style="background:#1f7a4d" aria-hidden="true"></span>${echapper(p.nom)}</td>
                    <td class="py-2 pr-3 text-slate-600">${p.type === 'AGENT' ? 'Agent' : 'Délégué'} · ${echapper(p.complement || '')}</td>
                    <td class="py-2 pr-3 font-mono text-xs">${echapper(p.identifiant)}</td>
                    <td class="py-2 pr-3 text-slate-600">${formaterDepuis(p.connecteDepuis)}</td>
                    <td class="py-2 text-slate-600">${formaterDepuis(p.derniereActivite)}</td>
                </tr>`).join('');
        }
    </script>
</body>
</html>
