<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Bon d'emprunt - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .feuille { font-family: "Public Sans", system-ui, sans-serif; color: #1a2233; background: #fff; }
        .feuille h1 { font-family: "Source Serif 4", Georgia, serif; }
        .feuille table td, .feuille table th { border-bottom: 1px solid #dde2ea; padding: .5rem .25rem; text-align: left; vertical-align: top; }
        .signature { border-top: 1px solid #1a2233; padding-top: .35rem; }
        @media print {
            @page { size: A4; margin: 14mm; }
            .feuille { box-shadow: none !important; border: none !important; padding: 0 !important; max-width: none !important; }
            main { padding: 0 !important; max-width: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-3xl mx-auto p-4 md:p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2 pas-impression">
            <a href="javascript:history.back()" class="text-sm text-blue-600 hover:underline">Retour</a>
            <button id="btnImprimer" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg">Imprimer ou enregistrer en PDF</button>
        </div>
        <p class="text-xs text-slate-500 pas-impression">Pour un PDF : cliquez sur « Imprimer » puis choisissez « Enregistrer au format PDF » comme imprimante.</p>
        <article id="feuille" class="feuille rounded-xl border border-slate-200 shadow-sm p-6 md:p-10"></article>
    </main>

    <script>
        const MODES = { DEMANDE: 'Demande en ligne, remise au poste', SCAN: 'Retrait par scan du QR code', TRANSFERT: 'Transfert entre délégués', RESERVATION: 'Réservation à l\'avance', AGENT: 'Au poste' };
        const STATUTS = { RESERVEE: 'Réservé', EN_ATTENTE: 'En attente de remise', EN_COURS: 'En cours', RETOURNE: 'Rendu', REFUSEE: 'Refusé', ANNULEE: 'Annulé' };

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ page: '' });
            document.getElementById('btnImprimer').addEventListener('click', () => window.print());
            const id = new URLSearchParams(location.search).get('id');
            const e = await appelApi('/emprunts/' + encodeURIComponent(id));
            if (!e || e.success === false) {
                document.getElementById('feuille').innerHTML = etatVide(e.message || 'Bon introuvable.');
                return;
            }
            document.title = `Bon d'emprunt n° ${e.id} - Gestion Matériel`;
            const lignes = e.details.map(d => {
                const etat = d.etatRetour ? LABELS_ETAT_RETOUR[d.etatRetour].texte : (d.rendu ? 'Transféré' : '');
                return `<tr><td>${echapper(d.materiel.designation)}</td><td>${echapper(d.materiel.codeUnique || '—')}</td>
                    <td>${d.materiel.typeGestion === 'CONSOMMABLE' ? d.quantite : 1}</td>
                    <td>${d.dateRetour ? formaterDate(d.dateRetour) : '—'}</td><td>${echapper(etat || '—')}</td></tr>`;
            }).join('');
            const ligne = (libelle, valeur) => valeur ? `<div><dt class="text-xs" style="color:#5a6478">${libelle}</dt><dd class="font-medium">${valeur}</dd></div>` : '';
            document.getElementById('feuille').innerHTML = `
                <header class="flex items-start justify-between gap-4 pb-5 border-b-2" style="border-color:#22406e">
                    <img src="img/logo-lbs.png" alt="Lomé Business School" class="h-16 w-auto">
                    <div class="text-right">
                        <h1 class="text-2xl font-bold" style="color:#22406e">Bon d'emprunt de matériel</h1>
                        <div class="text-sm" style="color:#5a6478">N° ${String(e.id).padStart(5, '0')} · ${STATUTS[e.statutEmprunt]}</div>
                    </div>
                </header>
                <dl class="grid grid-cols-2 gap-x-6 gap-y-3 py-5 text-sm">
                    ${ligne('Délégué', echapper(e.delegue.nom))}
                    ${ligne('Filière et niveau', echapper(e.delegue.filiereNiveau))}
                    ${ligne('Salle', echapper(e.salle))}
                    ${ligne('Mode', MODES[e.mode])}
                    ${ligne('Demandé le', formaterDate(e.dateDemande))}
                    ${e.dateReservation ? ligne('Créneau réservé', `${new Date(e.dateReservation + 'T00:00').toLocaleDateString('fr-FR')} de ${formaterHeure(e.heureDebut)} à ${formaterHeure(e.heureRetourPrevue)}`) : ''}
                    ${ligne('Sorti le', e.dateSortie ? formaterDate(e.dateSortie) : '')}
                    ${ligne('Remis par', e.agentSortie ? echapper(e.agentSortie.nom) : (e.transmisPar ? 'Transmis par ' + echapper(e.transmisPar) : ''))}
                    ${ligne('Retour prévu', e.heureRetourPrevue && !e.dateReservation ? formaterHeure(e.heureRetourPrevue) : '')}
                    ${ligne('Rendu le', e.dateRetour ? formaterDate(e.dateRetour) : '')}
                    ${ligne('Réceptionné par', e.agentRetour ? echapper(e.agentRetour.nom) : '')}
                </dl>
                <table class="w-full text-sm">
                    <thead><tr style="color:#5a6478"><th>Matériel</th><th>Code</th><th>Qté</th><th>Rendu le</th><th>État au retour</th></tr></thead>
                    <tbody>${lignes}</tbody>
                </table>
                ${e.observations ? `<p class="text-sm mt-4"><span style="color:#5a6478">Observations :</span> ${echapper(e.observations)}</p>` : ''}
                ${e.motifRefus ? `<p class="text-sm mt-4"><span style="color:#5a6478">Motif :</span> ${echapper(e.motifRefus)}</p>` : ''}
                <p class="text-xs mt-6" style="color:#5a6478">Le délégué s'engage à rendre le matériel en bon état à l'heure prévue et à signaler tout problème au poste de surveillance.</p>
                <div class="grid grid-cols-2 gap-10 mt-14 text-sm">
                    <div class="signature">Signature du délégué</div>
                    <div class="signature">Signature de l'agent de surveillance</div>
                </div>
                <footer class="text-[11px] mt-10 text-center" style="color:#9aa7bd">Lomé Business School · Gestion des emprunts de matériel · édité le ${new Date().toLocaleString('fr-FR')}</footer>`;
        });
    </script>
</body>
</html>
