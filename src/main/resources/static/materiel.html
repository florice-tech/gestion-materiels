<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Matériel - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-6">

    <div class="max-w-5xl mx-auto space-y-6">

        <div class="bg-blue-600 p-4 rounded-xl text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">Catalogue de Matériel</h1>
                <p class="text-blue-100 text-sm">Ajouter ou retirer des équipements</p>
            </div>
            <div class="flex gap-2">
                <a href="emprunt.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Emprunts</a>
                <a href="retour.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Retours</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div class="lg:col-span-1 bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-bold text-slate-800 text-md">Ajouter un matériel</h2>

                <form id="formAjout" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Désignation</label>
                        <input type="text" id="designation" placeholder="ex: Rallonge électrique"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Catégorie</label>
                        <select id="categorie" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                            <option value="AUDIOVISUEL">Audiovisuel</option>
                            <option value="ACCESSOIRES">Accessoires</option>
                            <option value="CONNECTIQUE">Connectique</option>
                            <option value="FOURNITURES">Fournitures</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Type de gestion</label>
                        <select id="typeGestion" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                            <option value="DURABLE">Durable (suivi unitaire)</option>
                            <option value="CONSOMMABLE">Consommable (suivi par quantité)</option>
                        </select>
                    </div>

                    <div id="champDurable">
                        <label class="block text-xs font-medium text-slate-600 mb-1">Code unique</label>
                        <input type="text" id="codeUnique" placeholder="ex: VP-02"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div id="champConsommable" class="hidden">
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quantité initiale</label>
                        <input type="number" id="quantiteStock" min="0" value="1"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div id="messageAjout" class="hidden text-xs rounded-lg p-2"></div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm">
                        Ajouter au catalogue
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-slate-800 text-md mb-4">Matériel existant</h2>
                <div id="listeCatalogue" class="space-y-2 max-h-[600px] overflow-y-auto">
                    <p class="text-sm text-slate-500 italic">Chargement...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        document.addEventListener('DOMContentLoaded', () => {
            chargerCatalogue();
            document.getElementById('formAjout').addEventListener('submit', ajouterMateriel);
            document.getElementById('typeGestion').addEventListener('change', basculerChamps);
            basculerChamps();
        });

        function basculerChamps() {
            const estDurable = document.getElementById('typeGestion').value === 'DURABLE';
            document.getElementById('champDurable').classList.toggle('hidden', !estDurable);
            document.getElementById('champConsommable').classList.toggle('hidden', estDurable);
        }

        const LABELS_STATUT = {
            DISPONIBLE: { texte: 'Disponible', classe: 'bg-green-100 text-green-700' },
            EMPRUNTE: { texte: 'Emprunté', classe: 'bg-blue-100 text-blue-700' },
            A_VERIFIER: { texte: 'À vérifier', classe: 'bg-amber-100 text-amber-700' },
            MAINTENANCE: { texte: 'Maintenance', classe: 'bg-red-100 text-red-700' },
            HS: { texte: 'Hors service', classe: 'bg-slate-200 text-slate-600' }
        };

        async function chargerCatalogue() {
            const res = await fetch(`${API_BASE}/materiels`);
            const materiels = await res.json();
            const conteneur = document.getElementById('listeCatalogue');
            conteneur.innerHTML = '';

            if (materiels.length === 0) {
                conteneur.innerHTML = '<p class="text-sm text-slate-500 italic">Aucun matériel dans le catalogue.</p>';
                return;
            }

            materiels.forEach(m => {
                const statut = LABELS_STATUT[m.statut] || { texte: m.statut, classe: 'bg-slate-100 text-slate-600' };
                const infoQuantite = m.typeGestion === 'DURABLE'
                    ? `<span class="text-xs text-slate-400">${m.codeUnique ?? ''}</span>`
                    : `<span class="text-xs text-slate-400">Stock : ${m.quantiteStock}</span>`;

                const ligne = document.createElement('div');
                ligne.className = "flex items-center justify-between p-3 border border-slate-200 rounded-lg text-sm";
                ligne.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="font-medium text-slate-800">${m.designation}</div>
                        <div class="flex gap-2 items-center">
                            <span class="text-xs text-slate-400">${m.categorie}</span>
                            ${infoQuantite}
                            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${statut.classe}">${statut.texte}</span>
                        </div>
                    </div>
                    <button data-id="${m.id}" data-nom="${m.designation}" class="btn-supprimer text-red-500 hover:text-red-700 text-xs font-medium px-3 py-1.5 border border-red-200 rounded-lg hover:bg-red-50">
                        Supprimer
                    </button>
                `;
                conteneur.appendChild(ligne);
            });

            document.querySelectorAll('.btn-supprimer').forEach(btn => {
                btn.addEventListener('click', () => supprimerMateriel(btn.dataset.id, btn.dataset.nom));
            });
        }

        async function ajouterMateriel(e) {
            e.preventDefault();
            const messageAjout = document.getElementById('messageAjout');
            messageAjout.classList.add('hidden');

            const typeGestion = document.getElementById('typeGestion').value;

            const payload = {
                designation: document.getElementById('designation').value,
                categorie: document.getElementById('categorie').value,
                typeGestion: typeGestion,
                codeUnique: typeGestion === 'DURABLE' ? document.getElementById('codeUnique').value : null,
                quantiteStock: typeGestion === 'CONSOMMABLE' ? parseInt(document.getElementById('quantiteStock').value) : null
            };

            try {
                const res = await fetch(`${API_BASE}/materiels`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                afficherMessageAjout(result.message, result.success);
                if (result.success) {
                    document.getElementById('formAjout').reset();
                    basculerChamps();
                    chargerCatalogue();
                }
            } catch (err) {
                afficherMessageAjout("Erreur de connexion au serveur.", false);
            }
        }

        async function supprimerMateriel(id, nom) {
            if (!confirm(`Supprimer "${nom}" du catalogue ?`)) return;

            try {
                const res = await fetch(`${API_BASE}/materiels/${id}`, { method: 'DELETE' });
                const result = await res.json();

                if (result.success) {
                    chargerCatalogue();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
            }
        }

        function afficherMessageAjout(texte, succes) {
            const zone = document.getElementById('messageAjout');
            zone.textContent = texte;
            zone.className = `text-xs rounded-lg p-2 ${succes ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            zone.classList.remove('hidden');
        }
    </script>
</body>
</html>
