<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">Catalogue de matériel</h1>
            <p class="text-sm text-slate-500">Ajoutez, modifiez, changez le statut ou réapprovisionnez le matériel.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Ajout -->
            <section class="lg:col-span-1 bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4 h-fit">
                <h2 class="font-bold text-slate-800">Ajouter un matériel</h2>
                <form id="formAjout" class="space-y-3">
                    <div>
                        <label for="designation" class="block text-xs font-medium text-slate-600 mb-1">Désignation</label>
                        <input type="text" id="designation" placeholder="ex : Rallonge électrique" required maxlength="100"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="categorie" class="block text-xs font-medium text-slate-600 mb-1">Catégorie</label>
                        <select id="categorie" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
                        <p class="text-xs text-slate-400 mt-1">Gérer les catégories : <a href="parametres.html" class="text-blue-600 hover:underline">Salles & catégories</a></p>
                    </div>
                    <div>
                        <label for="typeGestion" class="block text-xs font-medium text-slate-600 mb-1">Type de gestion</label>
                        <p class="text-xs text-slate-400 mb-1">Durable : suivi à l'unité avec un code. Consommable : suivi du stock, non rendu.</p>
                        <select id="typeGestion" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="DURABLE">Durable (rendu après usage)</option>
                            <option value="CONSOMMABLE">Consommable (par quantité)</option>
                        </select>
                    </div>
                    <div id="champDurable">
                        <label for="codeUnique" class="block text-xs font-medium text-slate-600 mb-1">Code unique (étiquette)</label>
                        <input type="text" id="codeUnique" placeholder="ex : VP-02" maxlength="50"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div id="champConsommable" class="hidden grid grid-cols-2 gap-3">
                        <div>
                            <label for="quantiteStock" class="block text-xs font-medium text-slate-600 mb-1">Quantité initiale</label>
                            <input type="number" id="quantiteStock" min="0" value="10"
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label for="seuilAlerte" class="block text-xs font-medium text-slate-600 mb-1">Seuil d'alerte</label>
                            <input type="number" id="seuilAlerte" min="0" value="5"
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                    <div id="messageAjout" class="hidden"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm">Ajouter au catalogue</button>
                </form>
            </section>

            <!-- Liste -->
            <section class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex flex-wrap gap-2">
                    <input id="filtreTexte" type="search" placeholder="Rechercher (nom, code)..."
                           class="flex-1 min-w-[160px] px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <select id="filtreCategorie" class="px-3 py-2 border border-slate-300 rounded-lg text-sm"></select>
                    <select id="filtreStatut" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">
                        <option value="">Tous les statuts</option>
                        <option value="DISPONIBLE">Disponible</option>
                        <option value="EMPRUNTE">Emprunté</option>
                        <option value="A_VERIFIER">À vérifier</option>
                        <option value="MAINTENANCE">Maintenance</option>
                        <option value="HS">Hors service</option>
                        <option value="STOCK_BAS">Stock bas</option>
                    </select>
                </div>
                <div id="messageCatalogue" class="hidden"></div>
                <p id="compteCatalogue" class="text-xs text-slate-500"></p>
                <div id="listeCatalogue" class="space-y-2"></div>
            </section>
        </div>
    </main>

    <script>
        let categories = [];
        let materiels = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'catalogue' });
            document.getElementById('formAjout').addEventListener('submit', ajouterMateriel);
            document.getElementById('typeGestion').addEventListener('change', basculerChamps);
            ['filtreTexte', 'filtreCategorie', 'filtreStatut'].forEach(id =>
                document.getElementById(id).addEventListener('input', afficherCatalogue));
            basculerChamps();
            await chargerCategories();
            chargerCatalogue();
        });

        function basculerChamps() {
            const estDurable = document.getElementById('typeGestion').value === 'DURABLE';
            document.getElementById('champDurable').classList.toggle('hidden', !estDurable);
            document.getElementById('champConsommable').classList.toggle('hidden', estDurable);
            document.getElementById('codeUnique').required = estDurable;
        }

        async function chargerCategories() {
            categories = await appelApi('/categories');
            const select = document.getElementById('categorie');
            select.innerHTML = categories.length
                ? categories.map(c => `<option value="${c.id}">${echapper(c.nom)}</option>`).join('')
                : '<option value="">Aucune catégorie — créez-en une</option>';
            document.getElementById('filtreCategorie').innerHTML = '<option value="">Toutes les catégories</option>' +
                categories.map(c => `<option value="${c.id}">${echapper(c.nom)}</option>`).join('');
        }

        async function chargerCatalogue() {
            materiels = await appelApi('/materiels');
            afficherCatalogue();
        }

        function afficherCatalogue() {
            const texte = document.getElementById('filtreTexte').value.toLowerCase().trim();
            const categorieId = document.getElementById('filtreCategorie').value;
            const statut = document.getElementById('filtreStatut').value;

            const liste = materiels.filter(m =>
                (!texte || `${m.designation} ${m.codeUnique || ''}`.toLowerCase().includes(texte)) &&
                (!categorieId || String(m.categorie.id) === categorieId) &&
                (!statut || (statut === 'STOCK_BAS' ? m.stockBas : m.typeGestion === 'DURABLE' && m.statut === statut)));

            document.getElementById('compteCatalogue').textContent = `${liste.length} matériel(s) sur ${materiels.length}`;
            const conteneur = document.getElementById('listeCatalogue');
            if (!liste.length) { conteneur.innerHTML = etatVide('Aucun matériel ne correspond.'); return; }

            conteneur.innerHTML = '';
            liste.forEach(m => {
                const estDurable = m.typeGestion === 'DURABLE';
                const statutInfo = LABELS_STATUT_MATERIEL[m.statut];
                const info = estDurable
                    ? `<span class="text-xs text-slate-500 font-mono">${echapper(m.codeUnique || '')}</span> ${badge(statutInfo)}`
                    : `<span class="text-xs ${m.stockBas ? 'text-red-600 font-semibold' : 'text-slate-500'}">Stock : ${m.quantiteStock}${m.stockBas ? ' ⚠' : ''}</span>
                       <span class="text-xs text-slate-400">(alerte à ${m.seuilAlerte})</span>`;

                let actions;
                if (estDurable) {
                    actions = m.statut === 'EMPRUNTE'
                        ? '<span class="text-xs text-slate-400 italic">Emprunté en ce moment</span>'
                        : `<select class="choix-statut px-2 py-1.5 border border-slate-300 rounded-lg text-xs" aria-label="Statut">${
                            Object.entries(LABELS_STATUT_MATERIEL).filter(([cle]) => cle !== 'EMPRUNTE')
                                .map(([cle, l]) => `<option value="${cle}" ${cle === m.statut ? 'selected' : ''}>${l.texte}</option>`).join('')}</select>`;
                } else {
                    actions = `<button class="btn-stock px-2 py-1.5 text-xs font-medium rounded-lg border border-blue-200 text-blue-600 hover:bg-blue-50">+ Stock</button>`;
                }

                const ligne = document.createElement('div');
                ligne.className = 'flex flex-col md:flex-row md:items-center justify-between gap-3 p-3 border border-slate-200 rounded-lg text-sm';
                ligne.innerHTML = `
                    <div class="space-y-1">
                        <div class="font-medium text-slate-800">${echapper(m.designation)}
                            <span class="text-xs font-normal text-slate-400">· ${echapper(m.categorie.nom)} · ${estDurable ? 'durable' : 'consommable'}</span></div>
                        <div class="flex flex-wrap gap-2 items-center">${info}</div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        ${actions}
                        <button class="btn-modifier px-2 py-1.5 text-xs font-medium rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50">Modifier</button>
                        <button class="btn-supprimer px-2 py-1.5 text-xs font-medium rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Supprimer</button>
                    </div>`;

                const choix = ligne.querySelector('.choix-statut');
                if (choix) choix.addEventListener('change', () => action(`/materiels/${m.id}/statut`, 'PATCH', { statut: choix.value }));
                const stock = ligne.querySelector('.btn-stock');
                if (stock) stock.addEventListener('click', () => reapprovisionner(m));
                ligne.querySelector('.btn-modifier').addEventListener('click', () => modifier(m));
                ligne.querySelector('.btn-supprimer').addEventListener('click', () => supprimer(m));
                conteneur.appendChild(ligne);
            });
        }

        async function ajouterMateriel(e) {
            e.preventDefault();
            const typeGestion = document.getElementById('typeGestion').value;
            const categorieId = document.getElementById('categorie').value;
            if (!categorieId) {
                afficherMessage('messageAjout', "Créez d'abord une catégorie (page Salles & catégories).", false);
                return;
            }
            const estDurable = typeGestion === 'DURABLE';
            const resultat = await appelApi('/materiels', {
                method: 'POST',
                body: {
                    designation: document.getElementById('designation').value.trim(),
                    categorieId: parseInt(categorieId),
                    typeGestion,
                    codeUnique: estDurable ? document.getElementById('codeUnique').value.trim() : null,
                    quantiteStock: estDurable ? null : parseInt(document.getElementById('quantiteStock').value || '0'),
                    seuilAlerte: estDurable ? null : parseInt(document.getElementById('seuilAlerte').value || '0')
                }
            });
            afficherMessage('messageAjout', resultat.message, resultat.success);
            if (resultat.success) {
                document.getElementById('designation').value = '';
                document.getElementById('codeUnique').value = '';
                chargerCatalogue();
            }
        }

        async function modifier(m) {
            const estDurable = m.typeGestion === 'DURABLE';
            const champs = [
                { nom: 'designation', label: 'Désignation', valeur: m.designation, requis: true },
                { nom: 'categorieId', label: 'Catégorie', type: 'select', valeur: m.categorie.id,
                  options: categories.map(c => ({ valeur: c.id, texte: c.nom })) }
            ];
            if (estDurable) {
                champs.push({ nom: 'codeUnique', label: 'Code unique', valeur: m.codeUnique, requis: true });
            } else {
                champs.push({ nom: 'seuilAlerte', label: "Seuil d'alerte de stock", type: 'number', valeur: m.seuilAlerte,
                              aide: 'Une alerte apparaît quand le stock atteint ce nombre.' });
            }
            const v = await demanderFormulaire({ titre: `Modifier « ${m.designation} »`, champs, bouton: 'Enregistrer' });
            if (!v) return;
            await action(`/materiels/${m.id}`, 'PUT', {
                designation: v.designation, categorieId: parseInt(v.categorieId), typeGestion: m.typeGestion,
                codeUnique: estDurable ? v.codeUnique : null,
                seuilAlerte: estDurable ? null : parseInt(v.seuilAlerte || '0')
            });
        }

        async function reapprovisionner(m) {
            const v = await demanderFormulaire({
                titre: `Réapprovisionner « ${m.designation} »`,
                texte: `Stock actuel : ${m.quantiteStock}.`,
                champs: [{ nom: 'quantite', label: 'Quantité à ajouter', type: 'number', valeur: 10, requis: true }],
                bouton: 'Ajouter au stock'
            });
            if (v) await action(`/materiels/${m.id}/stock`, 'PATCH', { quantite: parseInt(v.quantite || '0') });
        }

        async function supprimer(m) {
            if (await confirmer('Supprimer du catalogue', `Supprimer « ${m.designation} » ? Cette action est définitive.`, 'Supprimer', true)) {
                await action(`/materiels/${m.id}`, 'DELETE');
            }
        }

        async function action(chemin, method, body) {
            const resultat = await appelApi(chemin, { method, body });
            afficherMessage('messageCatalogue', resultat.message, resultat.success);
            chargerCatalogue();
        }
    </script>
</body>
</html>
