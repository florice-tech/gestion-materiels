<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique des Emprunts - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-blue-600 p-4 rounded-xl text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">Historique des Emprunts</h1>
                <p class="text-blue-100 text-sm">Journal complet des mouvements de matériel</p>
            </div>
            <div class="flex gap-2">
                <a href="accueil-agent.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Accueil</a>
                <a href="materiel.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Catalogue</a>
                <a href="emprunt.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Demandes</a>
                <a href="retour.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Retours</a>
            </div>
        </div>

        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex flex-col md:flex-row gap-3 mb-4">
                <input type="text" id="filtreNom" placeholder="Rechercher un délégué..."
                       class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase">
                            <th class="py-2 pr-4">Délégué</th>
                            <th class="py-2 pr-4">Salle</th>
                            <th class="py-2 pr-4">Sortie</th>
                            <th class="py-2 pr-4">Agent sortie</th>
                            <th class="py-2 pr-4">Retour</th>
                            <th class="py-2 pr-4">Agent retour</th>
                            <th class="py-2 pr-4">Matériel</th>
                            <th class="py-2">Observations</th>
                        </tr>
                    </thead>
                    <tbody id="corpsTableau">
                        <tr><td colspan="8" class="py-4 text-center text-slate-500 italic">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let toutHistorique = [];

        const LABELS_ETAT = {
            BON_ETAT: { texte: '🟢', classe: 'bg-green-100 text-green-700' },
            A_VERIFIER: { texte: '🟡', classe: 'bg-amber-100 text-amber-700' },
            ENDOMMAGE: { texte: '🔴', classe: 'bg-red-100 text-red-700' },
            VIDE_EPUISE: { texte: '⚫', classe: 'bg-slate-200 text-slate-600' }
        };

        document.addEventListener('DOMContentLoaded', () => {
            chargerHistorique();
            document.getElementById('filtreNom').addEventListener('input', appliquerFiltres);
        });

        async function chargerHistorique() {
            const res = await fetch(`${API_BASE}/emprunts/historique`);
            const result = await res.json();
            toutHistorique = result.success ? result.data : [];
            afficherLignes(toutHistorique);
        }

        function appliquerFiltres() {
            const nom = document.getElementById('filtreNom').value.toLowerCase();
            afficherLignes(toutHistorique.filter(e => e.delegue.nom.toLowerCase().includes(nom)));
        }

        function afficherLignes(liste) {
            const corps = document.getElementById('corpsTableau');
            corps.innerHTML = '';

            if (liste.length === 0) {
                corps.innerHTML = '<tr><td colspan="8" class="py-4 text-center text-slate-500 italic">Aucun résultat.</td></tr>';
                return;
            }

            liste.forEach(e => {
                const dateSortie = new Date(e.dateSortie).toLocaleString('fr-FR');
                const dateRetour = e.dateRetour ? new Date(e.dateRetour).toLocaleString('fr-FR') : '—';
                const agentRetour = e.agentRetour ? e.agentRetour.nom : '—';
                const agentSortie = e.agentSortie ? e.agentSortie.nom : '—';

                const materielHtml = e.details.map(d => {
                    if (!d.etatRetour) {
                        return `<div>${d.materiel.designation} <span class="text-slate-400">(en cours)</span></div>`;
                    }
                    const info = LABELS_ETAT[d.etatRetour] || { texte: '', classe: '' };
                    return `<div>${info.texte} ${d.materiel.designation}</div>`;
                }).join('');

                const ligne = document.createElement('tr');
                ligne.className = "border-b border-slate-100 hover:bg-slate-50 align-top";
                ligne.innerHTML = `
                    <td class="py-2 pr-4 font-medium text-slate-800">${e.delegue.nom}<div class="text-xs text-slate-400">${e.delegue.filiereNiveau}</div></td>
                    <td class="py-2 pr-4 text-slate-600">${e.salle}</td>
                    <td class="py-2 pr-4 text-slate-500 text-xs">${dateSortie}</td>
                    <td class="py-2 pr-4 text-slate-600">${agentSortie}</td>
                    <td class="py-2 pr-4 text-slate-500 text-xs">${dateRetour}</td>
                    <td class="py-2 pr-4 text-slate-600">${agentRetour}</td>
                    <td class="py-2 pr-4 text-xs">${materielHtml}</td>
                    <td class="py-2 text-slate-500 text-xs">${e.observations || '—'}</td>
                `;
                corps.appendChild(ligne);
            });
        }
    </script>
</body>
</html>
