<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Historique - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Historique des emprunts</h1>
                <p class="text-sm text-slate-500">Toutes les fiches : demandes, emprunts, retours, refus et annulations.</p>
            </div>
            <a href="/api/emprunts/export" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium px-4 py-2 rounded-lg shadow-sm">
                ⬇ Exporter en CSV (Excel)
            </a>
        </div>

        <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="search" id="filtreTexte" placeholder="Délégué, salle, matériel, agent..."
                       class="md:col-span-2 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <select id="filtreStatut" class="px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    <option value="">Tous les statuts</option>
                    <option value="EN_ATTENTE">En attente</option>
                    <option value="EN_COURS">En cours</option>
                    <option value="RETARD">En retard</option>
                    <option value="RETOURNE">Rendu</option>
                    <option value="REFUSEE">Refusée</option>
                    <option value="ANNULEE">Annulée</option>
                </select>
                <label class="flex items-center gap-2 text-xs text-slate-500">Du
                    <input type="date" id="filtreDu" class="flex-1 px-2 py-2 border border-slate-300 rounded-lg text-sm"></label>
                <label class="flex items-center gap-2 text-xs text-slate-500">Au
                    <input type="date" id="filtreAu" class="flex-1 px-2 py-2 border border-slate-300 rounded-lg text-sm"></label>
            </div>
            <p id="compte" class="text-xs text-slate-500"></p>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-slate-200 text-slate-500 text-xs uppercase">
                            <th class="py-2 pr-3">N°</th>
                            <th class="py-2 pr-3">Statut</th>
                            <th class="py-2 pr-3">Délégué</th>
                            <th class="py-2 pr-3">Salle</th>
                            <th class="py-2 pr-3">Demande</th>
                            <th class="py-2 pr-3">Sortie</th>
                            <th class="py-2 pr-3">Retour</th>
                            <th class="py-2 pr-3">Matériel</th>
                            <th class="py-2">Observations</th>
                        </tr>
                    </thead>
                    <tbody id="corpsTableau"></tbody>
                </table>
            </div>
            <p class="text-xs text-slate-400">État au retour : 🟢 bon état · 🟡 à vérifier · 🔴 endommagé · ⚫ vide / épuisé</p>
        </section>
    </main>

    <script>
        let historique = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'historique' });
            ['filtreTexte', 'filtreStatut', 'filtreDu', 'filtreAu'].forEach(id =>
                document.getElementById(id).addEventListener('input', afficher));
            const resultat = await appelApi('/emprunts/historique');
            historique = resultat.success ? resultat.data : [];
            afficher();
        });

        function afficher() {
            const texte = document.getElementById('filtreTexte').value.toLowerCase().trim();
            const statut = document.getElementById('filtreStatut').value;
            const du = document.getElementById('filtreDu').value;
            const au = document.getElementById('filtreAu').value;

            const liste = historique.filter(e => {
                const contenu = [e.delegue.nom, e.delegue.filiereNiveau, e.salle,
                    e.agentSortie?.nom, e.agentRetour?.nom, ...e.details.map(d => d.materiel.designation)]
                    .join(' ').toLowerCase();
                const jour = e.dateDemande.substring(0, 10);
                const statutOk = !statut || (statut === 'RETARD' ? e.enRetard : e.statutEmprunt === statut);
                return (!texte || contenu.includes(texte)) && statutOk && (!du || jour >= du) && (!au || jour <= au);
            });

            document.getElementById('compte').textContent = `${liste.length} fiche(s) sur ${historique.length}`;
            const corps = document.getElementById('corpsTableau');
            if (!liste.length) {
                corps.innerHTML = `<tr><td colspan="9">${etatVide('Aucun résultat.')}</td></tr>`;
                return;
            }

            corps.innerHTML = liste.map(e => {
                let remarque = echapper(e.observations || '');
                if (e.statutEmprunt === 'REFUSEE') {
                    remarque = `Refusée par ${echapper(e.agentRefus?.nom || '—')}${e.motifRefus ? ' : ' + echapper(e.motifRefus) : ''}`;
                } else if (e.statutEmprunt === 'ANNULEE') {
                    remarque = `Annulée par le délégué le ${formaterDate(e.dateTraitement)}`;
                }
                return `<tr class="border-b border-slate-100 hover:bg-slate-50 align-top">
                    <td class="py-2 pr-3 text-slate-400 text-xs">${e.id}</td>
                    <td class="py-2 pr-3">${badge(statutFiche(e))}</td>
                    <td class="py-2 pr-3 font-medium text-slate-800">${echapper(e.delegue.nom)}<div class="text-xs font-normal text-slate-400">${echapper(e.delegue.filiereNiveau)}</div></td>
                    <td class="py-2 pr-3 text-slate-600">${echapper(e.salle)}</td>
                    <td class="py-2 pr-3 text-xs text-slate-500 whitespace-nowrap">${formaterDate(e.dateDemande)}</td>
                    <td class="py-2 pr-3 text-xs text-slate-500 whitespace-nowrap">${formaterDate(e.dateSortie)}${e.agentSortie ? `<div>par ${echapper(e.agentSortie.nom)}</div>` : ''}${
                        e.heureRetourPrevue ? `<div class="${e.enRetard ? 'text-red-600 font-semibold' : ''}">prévu ${formaterHeure(e.heureRetourPrevue)}</div>` : ''}</td>
                    <td class="py-2 pr-3 text-xs text-slate-500 whitespace-nowrap">${formaterDate(e.dateRetour)}${e.agentRetour ? `<div>par ${echapper(e.agentRetour.nom)}</div>` : ''}</td>
                    <td class="py-2 pr-3 text-xs">${listeArticlesHtml(e)}</td>
                    <td class="py-2 text-xs text-slate-500 max-w-xs">${remarque || '—'}</td>
                </tr>`;
            }).join('');
        }
    </script>
</body>
</html>
