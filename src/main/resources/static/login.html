<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        <div class="bg-blue-600 px-6 py-6 text-white text-center">
            <div id="logo" class="flex justify-center mb-3"></div>
            <h1 class="text-xl font-bold">Gestion des Emprunts de Matériel</h1>
            <p class="text-blue-100 text-xs uppercase tracking-wider mt-1">Lomé Business School</p>
            <p class="text-blue-100 text-sm mt-1">Agents de surveillance et délégués</p>
        </div>

        <form id="formConnexion" class="p-6 space-y-4">
            <div id="messageZone" class="hidden"></div>
            <div>
                <label for="identifiant" class="block text-sm font-medium text-slate-700 mb-1">Identifiant</label>
                <input type="text" id="identifiant" autocomplete="username" autofocus required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label for="motDePasse" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
                <input type="password" id="motDePasse" autocomplete="current-password" required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" id="btnConnexion" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-medium py-2.5 rounded-lg text-sm">
                Se connecter
            </button>
            <p class="text-center text-sm text-slate-500">
                Délégué sans compte ? <a href="inscription-delegue.html" class="text-blue-600 hover:underline font-medium">Créer un compte</a>
            </p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('logo').innerHTML = logoHtml('h-14');
            if (new URLSearchParams(location.search).has('expire')) {
                afficherMessage('messageZone', 'Votre session a expiré, veuillez vous reconnecter.', false);
            }
            // Déjà connecté : direction son espace
            const moi = await appelApi('/auth/moi', { sansRedirection: true });
            if (moi && moi.success) allerALAccueil(moi);

            document.getElementById('formConnexion').addEventListener('submit', seConnecter);
        });

        function allerALAccueil(utilisateur) {
            window.location.href = utilisateur.type === 'AGENT' ? 'accueil-agent.html' : 'accueil-delegue.html';
        }

        async function seConnecter(e) {
            e.preventDefault();
            const bouton = document.getElementById('btnConnexion');
            bouton.disabled = true;

            const resultat = await appelApi('/auth/login', {
                method: 'POST',
                sansRedirection: true,
                body: {
                    identifiant: document.getElementById('identifiant').value.trim(),
                    motDePasse: document.getElementById('motDePasse').value
                }
            });

            bouton.disabled = false;
            if (resultat.success) {
                allerALAccueil(resultat);
            } else {
                afficherMessage('messageZone', resultat.message, false);
                document.getElementById('motDePasse').select();
            }
        }
    </script>
</body>
</html>
