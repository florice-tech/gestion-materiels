<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Tableau de bord - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-2">
            <div>
                <h1 class="text-2xl md:text-3xl text-slate-800">Tableau de bord</h1>
                <p id="dateDuJour" class="text-sm text-slate-500"></p>
            </div>
            <button id="btnActualiser" class="text-sm text-blue-600 hover:underline font-medium">↻ Actualiser</button>
        </div>

        <!-- Compteurs -->
        <section id="compteurs" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Activité 7 jours -->
            <section class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-semibold text-slate-800">Sorties de matériel — 7 derniers jours</h2>
                <p class="text-xs text-slate-500 mb-4">Nombre de fiches validées (matériel remis) par jour</p>
                <div id="graphiqueActivite" class="h-48 flex items-end gap-2 border-b border-slate-200"></div>
                <div id="etiquettesActivite" class="flex gap-2 mt-2"></div>
            </section>

            <!-- État du parc -->
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-semibold text-slate-800">Matériel durable</h2>
                <p id="totalParc" class="text-xs text-slate-500 mb-4"></p>
                <ul id="etatParc" class="space-y-2 text-sm"></ul>
            </section>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-slate-800">⚠ Retards</h2>
                    <a href="retour.html" class="text-xs text-blue-600 hover:underline">Gérer les retours</a>
                </div>
                <div id="listeRetards" class="space-y-2"></div>
            </section>

            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-slate-800">Stocks bas</h2>
                    <a href="materiel.html" class="text-xs text-blue-600 hover:underline">Catalogue</a>
                </div>
                <div id="listeStocksBas" class="space-y-2"></div>
            </section>

            <section class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <h2 class="font-semibold text-slate-800 mb-3">Matériel le plus emprunté</h2>
                <div id="listePopulaires" class="space-y-3"></div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'tableau' });
            document.getElementById('dateDuJour').textContent =
                new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('btnActualiser').addEventListener('click', charger);
            charger();
            setInterval(charger, 60000); // actualisation automatique chaque minute
        });

        async function charger() {
            const t = await appelApi('/statistiques');
            if (!t || !t.compteurs) return;
            afficherCompteurs(t.compteurs);
            afficherActivite(t.activite7Jours);
            afficherParc(t.parcDurable);
            afficherRetards(t.retards);
            afficherStocksBas(t.stocksBas);
            afficherPopulaires(t.materielsPopulaires);
        }

        function tuile(libelle, valeur, lien, alerte) {
            return `<a href="${lien}" class="bg-white p-4 rounded-xl border ${alerte ? 'border-red-300 bg-red-50' : 'border-slate-200'} shadow-sm hover:shadow-md transition block">
                <div class="text-xs font-medium text-slate-500">${libelle}</div>
                <div class="text-3xl font-bold mt-1 ${alerte ? 'text-red-700' : 'text-slate-800'}">${valeur}</div>
            </a>`;
        }

        function afficherCompteurs(c) {
            document.getElementById('compteurs').innerHTML =
                tuile('Demandes à traiter', c.demandesEnAttente, 'emprunt.html', false) +
                tuile('Emprunts en cours', c.empruntsEnCours, 'retour.html', false) +
                tuile('En retard', c.empruntsEnRetard, 'retour.html', c.empruntsEnRetard > 0) +
                tuile("Sorties aujourd'hui", c.sortiesAujourdhui, 'historique.html', false) +
                tuile("Retours aujourd'hui", c.retoursAujourdhui, 'historique.html', false);
        }

        // Diagramme en barres simple, une seule série : hauteur proportionnelle, valeur au survol et au-dessus
        function afficherActivite(jours) {
            const max = Math.max(1, ...jours.map(j => j.sorties));
            document.getElementById('graphiqueActivite').innerHTML = jours.map(j => {
                const hauteur = j.sorties === 0 ? 0 : Math.max(4, Math.round(j.sorties / max * 100));
                return `<div class="flex-1 h-full flex flex-col justify-end items-center group" title="${formaterJour(j.jour + 'T00:00:00')} : ${j.sorties} sortie(s)">
                    <span class="text-xs text-slate-600 mb-1 ${j.sorties === 0 ? 'opacity-0' : ''}">${j.sorties}</span>
                    <div class="w-full max-w-10 bg-blue-500 group-hover:bg-blue-700 rounded-t" style="height:${hauteur}%"></div>
                </div>`;
            }).join('');
            document.getElementById('etiquettesActivite').innerHTML = jours.map(j =>
                `<div class="flex-1 text-center text-[11px] text-slate-500 whitespace-nowrap">${formaterJourCourt(j.jour)}</div>`).join('');
        }

        function afficherParc(p) {
            document.getElementById('totalParc').textContent = `${p.total} équipement(s) suivis à l'unité`;
            const lignes = [
                ['DISPONIBLE', p.disponibles], ['EMPRUNTE', p.empruntes, 'Emprunté ou réservé'], ['A_VERIFIER', p.aVerifier],
                ['MAINTENANCE', p.maintenance], ['HS', p.horsService]
            ];
            document.getElementById('etatParc').innerHTML = lignes.map(([statut, n, libelle]) => {
                const info = libelle ? { ...LABELS_STATUT_MATERIEL[statut], texte: libelle } : LABELS_STATUT_MATERIEL[statut];
                const pct = p.total ? Math.round(n / p.total * 100) : 0;
                return `<li>
                    <div class="flex justify-between"><span>${badge(info)}</span><span class="font-semibold text-slate-700">${n}</span></div>
                    <div class="h-1.5 bg-slate-100 rounded mt-1"><div class="h-1.5 bg-slate-400 rounded" style="width:${pct}%"></div></div>
                </li>`;
            }).join('');
        }

        function afficherRetards(retards) {
            const zone = document.getElementById('listeRetards');
            if (!retards.length) { zone.innerHTML = etatVide('Aucun retard 👍'); return; }
            zone.innerHTML = retards.map(e => `
                <div class="p-3 rounded-lg border border-red-200 bg-red-50 text-sm">
                    <div class="font-semibold text-slate-800">${echapper(e.delegue.nom)} <span class="text-xs font-normal text-slate-500">— salle ${echapper(e.salle)}</span></div>
                    <div class="text-xs text-red-700">Attendu le ${formaterDate(e.echeance)}</div>
                    <div class="text-xs text-slate-600 mt-1">${listeArticlesHtml(e)}</div>
                </div>`).join('');
        }

        function afficherStocksBas(materiels) {
            const zone = document.getElementById('listeStocksBas');
            if (!materiels.length) { zone.innerHTML = etatVide('Tous les stocks sont suffisants.'); return; }
            zone.innerHTML = materiels.map(m => `
                <div class="flex justify-between items-center p-3 rounded-lg border border-amber-200 bg-amber-50 text-sm">
                    <span class="font-medium text-slate-800">${echapper(m.designation)}</span>
                    <span class="text-xs ${m.quantiteStock === 0 ? 'text-red-700 font-bold' : 'text-amber-800'}">
                        ${m.quantiteStock === 0 ? 'Épuisé' : `${m.quantiteStock} restant(s)`} · seuil ${m.seuilAlerte}</span>
                </div>`).join('');
        }

        function afficherPopulaires(liste) {
            const zone = document.getElementById('listePopulaires');
            if (!liste.length) { zone.innerHTML = etatVide('Pas encore d\'emprunt.'); return; }
            const max = Math.max(...liste.map(m => m.nombreEmprunts));
            zone.innerHTML = liste.map(m => `
                <div class="text-sm" title="${echapper(m.designation)} : ${m.nombreEmprunts} emprunt(s), ${m.quantiteTotale} unité(s)">
                    <div class="flex justify-between"><span class="text-slate-700">${echapper(m.designation)}</span>
                        <span class="font-semibold text-slate-700">${m.nombreEmprunts}</span></div>
                    <div class="h-1.5 bg-slate-100 rounded mt-1"><div class="h-1.5 bg-blue-500 rounded" style="width:${Math.round(m.nombreEmprunts / max * 100)}%"></div></div>
                </div>`).join('');
        }
    </script>
</body>
</html>
