<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retour Matériel - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-6">

    <div class="max-w-5xl mx-auto space-y-6">

        <div class="bg-blue-600 p-4 rounded-xl text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">Retour & Restitution de Matériel</h1>
                <p class="text-blue-100 text-sm">Gestion des fiches actives</p>
            </div>
            <div class="flex gap-2">
                <a href="materiel.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Catalogue</a>
                <a href="emprunt.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">+ Nouvel Emprunt</a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div class="lg:col-span-1 bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-bold text-slate-800 text-md">Emprunts en cours</h2>
                <div id="listeEmprunts" class="space-y-3 max-h-[500px] overflow-y-auto">
                    <p class="text-sm text-slate-500 italic">Chargement des emprunts...</p>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <form id="formRetour" class="space-y-6 hidden">

                    <input type="hidden" id="emprunt_id">

                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <span class="text-xs font-bold text-blue-600 uppercase">Fiche sélectionnée</span>
                        <h3 id="recapEmprunteur" class="text-lg font-bold text-slate-800">---</h3>
                        <p id="recapDetails" class="text-sm text-slate-600">---</p>
                        <p id="recapRetard" class="text-sm font-semibold text-red-600 mt-1 hidden">⚠ Ce matériel est en retard de retour.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Agent qui réceptionne (vous)</label>
                        <select id="agentRetourId" class="w-full md:w-1/2 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                            <option value="">Chargement...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">État du matériel au retour</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <label class="border-2 border-slate-200 p-3 rounded-lg flex items-center space-x-2 cursor-pointer hover:bg-green-50 hover:border-green-400 text-sm">
                                <input type="radio" name="etat_retour" value="BON_ETAT" class="text-green-600" checked>
                                <span class="font-semibold text-green-800">🟢 Bon état</span>
                            </label>
                            <label class="border-2 border-slate-200 p-3 rounded-lg flex items-center space-x-2 cursor-pointer hover:bg-amber-50 hover:border-amber-400 text-sm">
                                <input type="radio" name="etat_retour" value="A_VERIFIER" class="text-amber-600">
                                <span class="font-semibold text-amber-800">🟡 À vérifier / Non testé</span>
                            </label>
                            <label class="border-2 border-slate-200 p-3 rounded-lg flex items-center space-x-2 cursor-pointer hover:bg-red-50 hover:border-red-400 text-sm">
                                <input type="radio" name="etat_retour" value="ENDOMMAGE" class="text-red-600">
                                <span class="font-semibold text-red-800">🔴 Endommagé / Vide</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Observations / Remarques</label>
                        <textarea id="observations" rows="3" placeholder="Ex: Câble HDMI manquant..."
                                  class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <div id="messageZone" class="hidden text-sm rounded-lg p-3"></div>

                    <div class="flex justify-end">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg shadow-sm">
                            Enregistrer le retour
                        </button>
                    </div>
                </form>

                <div id="emptyState" class="text-center py-12 text-slate-400">
                    <p class="text-sm">Sélectionnez une fiche d'emprunt à gauche pour enregistrer le retour du matériel.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        document.addEventListener('DOMContentLoaded', () => {
            chargerEmpruntsActifs();
            chargerAgents();
            document.getElementById('formRetour').addEventListener('submit', validerRetour);
        });

        async function chargerAgents() {
            const res = await fetch(`${API_BASE}/agents`);
            const agents = await res.json();
            const select = document.getElementById('agentRetourId');
            select.innerHTML = '<option value="">Sélectionner un agent</option>';
            agents.forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = `${a.nom} (${a.role})`;
                select.appendChild(opt);
            });
        }

        function estEnRetard(emprunt) {
            if (!emprunt.heureRetourPrevue) return false;

            const dateSortie = new Date(emprunt.dateSortie);
            const [heures, minutes] = emprunt.heureRetourPrevue.split(':').map(Number);

            const echeance = new Date(dateSortie);
            echeance.setHours(heures, minutes, 0, 0);

            return new Date() > echeance;
        }

        async function chargerEmpruntsActifs() {
            const res = await fetch(`${API_BASE}/emprunts/actifs`);
            const result = await res.json();
            const conteneur = document.getElementById('listeEmprunts');
            conteneur.innerHTML = '';

            if (!result.success || result.data.length === 0) {
                conteneur.innerHTML = '<p class="text-sm text-slate-500 italic p-2">Aucun emprunt en cours.</p>';
                return;
            }

            const emprunts = result.data.map(item => ({ ...item, enRetard: estEnRetard(item) }));
            emprunts.sort((a, b) => (b.enRetard === a.enRetard) ? 0 : (b.enRetard ? 1 : -1));

            emprunts.forEach(item => {
                const card = document.createElement('div');
                card.className = `p-3 border rounded-lg cursor-pointer transition text-sm space-y-1 ${
                    item.enRetard
                        ? 'border-red-300 bg-red-50 hover:bg-red-100'
                        : 'border-slate-200 hover:bg-blue-50 hover:border-blue-300'
                }`;
                card.onclick = () => selectionnerFiche(item);

                const dateSortie = new Date(item.dateSortie).toLocaleString('fr-FR');
                const heurePrevue = item.heureRetourPrevue ? item.heureRetourPrevue.substring(0, 5) : null;

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="font-semibold text-slate-800">${item.delegueNom}</div>
                        ${item.enRetard ? '<span class="text-[10px] font-bold text-white bg-red-600 px-2 py-0.5 rounded-full">EN RETARD</span>' : ''}
                    </div>
                    <div class="text-xs text-slate-500">${item.filiereNiveau} — <span class="font-bold text-blue-600">${item.salle}</span></div>
                    <div class="text-[11px] text-slate-400">Sorti le ${dateSortie} (remis par ${item.agentSortie.nom})</div>
                    ${heurePrevue ? `<div class="text-[11px] ${item.enRetard ? 'text-red-600 font-semibold' : 'text-slate-400'}">Retour prévu : ${heurePrevue}</div>` : ''}
                `;
                conteneur.appendChild(card);
            });
        }

        function selectionnerFiche(item) {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('formRetour').classList.remove('hidden');
            document.getElementById('emprunt_id').value = item.id;
            document.getElementById('recapEmprunteur').innerText = item.delegueNom;
            document.getElementById('recapDetails').innerText = `${item.filiereNiveau} | Salle : ${item.salle}`;

            const recapRetard = document.getElementById('recapRetard');
            recapRetard.classList.toggle('hidden', !item.enRetard);
        }

        async function validerRetour(e) {
            e.preventDefault();
            const messageZone = document.getElementById('messageZone');
            messageZone.classList.add('hidden');

            const payload = {
                empruntId: parseInt(document.getElementById('emprunt_id').value),
                agentRetourId: parseInt(document.getElementById('agentRetourId').value),
                etatRetour: document.querySelector('input[name="etat_retour"]:checked').value,
                observations: document.getElementById('observations').value
            };

            try {
                const res = await fetch(`${API_BASE}/emprunts/retour`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    afficherMessage(result.message, true);
                    setTimeout(() => location.reload(), 1200);
                } else {
                    afficherMessage(result.message, false);
                }
            } catch (err) {
                afficherMessage("Erreur de connexion au serveur.", false);
            }
        }

        function afficherMessage(texte, succes) {
            const zone = document.getElementById('messageZone');
            zone.textContent = texte;
            zone.className = `text-sm rounded-lg p-3 ${succes ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'}`;
            zone.classList.remove('hidden');
        }
    </script>
</body>
</html>
