<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Fiche matériel - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .qr img, .qr canvas { width: 100%; height: auto; }
        .etape { position: relative; padding-left: 1.75rem; }
        .etape::before { content: ""; position: absolute; left: .45rem; top: 1.4rem; bottom: -1rem; width: 2px; background: var(--ligne); }
        .etape:last-child::before { display: none; }
        .etape .point { position: absolute; left: 0; top: .35rem; width: 1rem; height: 1rem; border-radius: 999px; border: 3px solid var(--surface); }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-5">
        <a href="materiel.html" class="text-sm text-blue-600 hover:underline">Retour au catalogue</a>
        <div id="entetFiche"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <section class="lg:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                <h2 id="titreParcours" class="font-semibold text-slate-800 text-lg">Parcours</h2>
                <p id="aideParcours" class="text-sm text-slate-500 mb-5">Qui a eu ce matériel, quand, et comment il est passé de main en main. Le plus récent en premier.</p>
                <div id="parcours" class="space-y-4"></div>
            </section>
            <aside class="space-y-5">
                <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <h2 class="font-semibold text-slate-800 mb-3">QR code</h2>
                    <div id="qr" class="qr max-w-[200px] mx-auto bg-white p-2 rounded border border-slate-200"></div>
                    <p id="codeQr" class="text-center text-xl font-extrabold tracking-wider text-slate-800 mt-2"></p>
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <button id="btnPng" class="px-3 py-2 text-sm rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium">Télécharger</button>
                        <a id="lienImprimer" href="etiquettes.html" class="px-3 py-2 text-sm text-center rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50" style="text-decoration:none">Imprimer</a>
                    </div>
                </section>
                <section id="resume" class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 text-sm space-y-2"></section>
            </aside>
        </div>
    </main>

    <script>
        const MODES = { DEMANDE: 'Demande en ligne', SCAN: 'Scan du QR code', TRANSFERT: 'Transfert', RESERVATION: 'Réservation', AGENT: 'Au poste' };
        const COULEUR_ETAPE = { EN_COURS: '#22406e', RETOURNE: '#1f7a4d', EN_ATTENTE: '#b26a00', RESERVEE: '#5d82b2', REFUSEE: '#9aa7bd', ANNULEE: '#9aa7bd' };

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'catalogue' });
            const id = parseInt(new URLSearchParams(location.search).get('id'));
            const materiel = (await appelApi('/materiels')).find(m => m.id === id);
            if (!materiel) {
                document.getElementById('entetFiche').innerHTML = `<div class="bg-white rounded-xl border border-slate-200">${etatVide('Matériel introuvable.')}</div>`;
                return;
            }
            const parcours = await appelApi(`/materiels/${id}/parcours`);
            afficherEntete(materiel, parcours);
            afficherParcours(parcours);
            afficherResume(materiel, parcours);
            if (materiel.typeGestion === 'CONSOMMABLE') {
                document.getElementById('titreParcours').textContent = 'Distributions';
                document.getElementById('aideParcours').textContent = 'Qui a demandé cette fourniture, quand et en quelle quantité. Le plus récent en premier.';
            }
            const zoneQr = document.getElementById('qr');
            document.getElementById('codeQr').textContent = materiel.codeUnique || '';
            document.getElementById('lienImprimer').href = 'etiquettes.html?code=' + encodeURIComponent(materiel.codeUnique || '');
            await dessinerQr(zoneQr, materiel.codeUnique, 440);
            document.getElementById('btnPng').addEventListener('click', () => telechargerEtiquette(zoneQr, materiel));
        });

        function afficherEntete(m, parcours) {
            const enCours = parcours.find(e => e.statut === 'EN_COURS' && !e.dateRetour);
            document.title = `${m.designation} - Gestion Matériel`;
            document.getElementById('entetFiche').innerHTML = `
                <div class="flex flex-wrap items-end justify-between gap-3">
                    <div>
                        <h1 class="text-2xl md:text-3xl text-slate-800">${echapper(m.designation)}</h1>
                        <p class="text-sm text-slate-500 mt-1">${echapper(m.codeUnique || '')} · ${echapper(m.categorie.nom.charAt(0) + m.categorie.nom.slice(1).toLowerCase())} · ${m.typeGestion === 'DURABLE' ? 'durable' : 'fourniture'}</p>
                    </div>
                    ${m.typeGestion === 'DURABLE' ? badge(LABELS_STATUT_MATERIEL[m.statut])
                        : badge({ texte: m.quantiteStock > 0 ? `${m.quantiteStock} en stock` : 'Épuisé', classe: m.stockBas ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-700' })}
                </div>
                ${enCours ? `<div class="mt-4 rounded-xl border ${enCours.enRetard ? 'border-red-200 bg-red-50' : 'border-blue-200 bg-blue-50'} p-4 text-sm">
                    <span class="text-slate-600">Actuellement chez</span> <strong class="text-slate-800">${echapper(enCours.delegue)}</strong>
                    <span class="text-slate-600">(${echapper(enCours.filiereNiveau)}), salle ${echapper(enCours.salle)}, depuis ${formaterDate(enCours.dateSortie)}${enCours.heureFin ? `, retour prévu à ${formaterHeure(enCours.heureFin)}` : ''}.</span>
                    ${enCours.enRetard ? '<strong class="text-red-700"> En retard.</strong>' : ''}</div>` : ''}`;
        }

        function afficherParcours(etapes) {
            const zone = document.getElementById('parcours');
            if (!etapes.length) { zone.innerHTML = etatVide('Ce matériel n\'a encore jamais été emprunté.'); return; }
            zone.innerHTML = etapes.map(e => {
                const sortie = e.dateSortie
                    ? `Sorti le ${formaterDate(e.dateSortie)} · ${MODES[e.modeSortie]}${e.remisPar ? ` (remis par ${echapper(e.remisPar)})` : ''}${e.transmisPar ? ` (transmis par ${echapper(e.transmisPar)})` : ''}`
                    : (e.statut === 'RESERVEE' ? `Réservé pour le ${new Date(e.dateReservation + 'T00:00').toLocaleDateString('fr-FR')} de ${formaterHeure(e.heureDebut)} à ${formaterHeure(e.heureFin)}`
                    : `Demandé le ${formaterDate(e.dateDemande)}`);
                const etat = e.etatRetour ? LABELS_ETAT_RETOUR[e.etatRetour] : null;
                const retour = e.dateRetour
                    ? `Rendu le ${formaterDate(e.dateRetour)}${e.modeRetour ? ` · ${MODES[e.modeRetour]}` : ''}${etat ? ` · ${etat.icone} ${etat.texte}` : ''}`
                    : (e.statut === 'EN_COURS' ? 'Pas encore rendu' : '');
                return `<div class="etape">
                    <span class="point" style="background:${COULEUR_ETAPE[e.statut] || '#9aa7bd'}"></span>
                    <div class="flex flex-wrap items-baseline justify-between gap-2">
                        <div class="font-semibold text-slate-800">${echapper(e.delegue)} <span class="font-normal text-sm text-slate-500">· ${echapper(e.filiereNiveau)} · salle ${echapper(e.salle)}</span></div>
                        ${badge(statutFiche({ statutEmprunt: e.statut, enRetard: e.enRetard }))}
                    </div>
                    <div class="text-sm text-slate-600 mt-1">${sortie}</div>
                    ${retour ? `<div class="text-sm ${e.dateRetour ? 'text-slate-600' : 'text-blue-700 font-medium'}">${retour}</div>` : ''}
                    ${e.remarque ? `<div class="text-sm text-slate-500 mt-1 italic">« ${echapper(e.remarque)} »</div>` : ''}
                    <a href="bon.html?id=${e.empruntId}" class="text-xs text-blue-600">Bon d'emprunt n° ${e.empruntId}</a>
                </div>`;
            }).join('');
        }

        function afficherResume(m, etapes) {
            const sorties = etapes.filter(e => e.dateSortie);
            const personnes = new Set(sorties.map(e => e.delegue)).size;
            const transferts = sorties.filter(e => e.modeSortie === 'TRANSFERT').length;
            const problemes = etapes.filter(e => e.etatRetour && e.etatRetour !== 'BON_ETAT').length;
            const ligne = (libelle, valeur, alerte) => `<div class="flex justify-between"><span class="text-slate-500">${libelle}</span><strong class="${alerte ? 'text-red-700' : 'text-slate-800'}">${valeur}</strong></div>`;
            if (m.typeGestion === 'CONSOMMABLE') {
                document.getElementById('resume').innerHTML = `<h2 class="font-semibold text-slate-800 mb-1">En résumé</h2>`
                    + ligne('Stock actuel', m.quantiteStock, m.stockBas) + ligne('Alerte à partir de', m.seuilAlerte)
                    + ligne('Distributions', sorties.length) + ligne('Délégués différents', personnes);
                return;
            }
            document.getElementById('resume').innerHTML = `
                <h2 class="font-semibold text-slate-800 mb-1">En résumé</h2>
                <div class="flex justify-between"><span class="text-slate-500">Emprunts</span><strong class="text-slate-800">${sorties.length}</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Délégués différents</span><strong class="text-slate-800">${personnes}</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Transferts entre délégués</span><strong class="text-slate-800">${transferts}</strong></div>
                <div class="flex justify-between"><span class="text-slate-500">Retours avec problème</span><strong class="${problemes ? 'text-red-700' : 'text-slate-800'}">${problemes}</strong></div>`;
        }
    </script>
</body>
</html>
