<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes emprunts - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-3xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex flex-wrap justify-between items-end gap-2">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Mes emprunts</h1>
                <p class="text-sm text-slate-500">Une demande en attente peut être annulée tant qu'elle n'a pas été validée.</p>
            </div>
            <a href="demande-emprunt.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg">+ Nouvelle demande</a>
        </div>

        <div id="messageZone" class="hidden"></div>
        <div id="listeEmprunts" class="space-y-3"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'DELEGUE', page: 'mes-emprunts' });
            charger();
        });

        async function charger() {
            const resultat = await appelApi('/emprunts/mes-emprunts');
            const emprunts = resultat.success ? resultat.data : [];
            const conteneur = document.getElementById('listeEmprunts');

            if (!emprunts.length) {
                conteneur.innerHTML = `<div class="bg-white rounded-xl border border-slate-200">${etatVide('Aucune demande pour le moment.')}</div>`;
                return;
            }

            conteneur.innerHTML = '';
            emprunts.forEach(e => {
                const heure = formaterHeure(e.heureRetourPrevue);
                let suivi = `Demandé le ${formaterDate(e.dateDemande)}`;
                if (e.dateSortie) suivi += ` · remis le ${formaterDate(e.dateSortie)} par ${echapper(e.agentSortie?.nom || '—')}`;
                if (e.dateRetour) suivi += ` · rendu le ${formaterDate(e.dateRetour)}`;

                let complement = '';
                if (e.statutEmprunt === 'EN_ATTENTE') {
                    complement = '<p class="text-xs text-amber-800">Passez au poste de surveillance pour récupérer le matériel.</p>';
                } else if (e.enRetard) {
                    complement = `<p class="text-xs text-red-700 font-semibold">⚠ À rendre depuis le ${formaterDate(e.echeance)} : rapportez-le au plus vite.</p>`;
                } else if (e.statutEmprunt === 'REFUSEE') {
                    complement = `<p class="text-xs text-slate-600">Refusée${e.motifRefus ? ' : ' + echapper(e.motifRefus) : '.'}</p>`;
                } else if (e.observations) {
                    complement = `<p class="text-xs text-slate-500">Remarque de l'agent : ${echapper(e.observations)}</p>`;
                }

                const carte = document.createElement('div');
                carte.className = `bg-white border rounded-xl shadow-sm p-4 text-sm space-y-2 ${e.enRetard ? 'border-red-300' : 'border-slate-200'}`;
                carte.innerHTML = `
                    <div class="flex justify-between items-start gap-3">
                        <div>
                            <div class="font-semibold text-slate-800">Salle ${echapper(e.salle)}${heure ? ` · retour avant ${heure}` : ''}</div>
                            <div class="text-xs text-slate-500">${suivi}</div>
                        </div>
                        ${badge(statutFiche(e))}
                    </div>
                    <div class="text-sm text-slate-700">${listeArticlesHtml(e)}</div>
                    ${complement}
                    ${e.statutEmprunt === 'EN_ATTENTE' ? `<div class="flex justify-end">
                        <button class="btn-annuler px-3 py-1.5 text-xs font-medium rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Annuler la demande</button></div>` : ''}`;
                const btn = carte.querySelector('.btn-annuler');
                if (btn) btn.addEventListener('click', () => annuler(e));
                conteneur.appendChild(carte);
            });
        }

        async function annuler(e) {
            if (!await confirmer('Annuler la demande', `Annuler votre demande pour la salle ${e.salle} ?`, 'Annuler la demande', true)) return;
            const resultat = await appelApi(`/emprunts/${e.id}/annuler`, { method: 'POST' });
            afficherMessage('messageZone', resultat.message, resultat.success);
            charger();
        }
    </script>
</body>
</html>
