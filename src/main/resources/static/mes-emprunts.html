<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes emprunts - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans p-6">

    <div class="max-w-3xl mx-auto space-y-6">

        <div class="bg-blue-600 p-4 rounded-xl text-white flex justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">Mes emprunts</h1>
                <p id="sousTitre" class="text-blue-100 text-sm"></p>
            </div>
            <div class="flex gap-2">
                <a href="demande-emprunt.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Nouvelle demande</a>
                <a href="accueil-delegue.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Retour</a>
            </div>
        </div>

        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
            <p class="text-sm text-slate-600">
                Une demande <strong>en attente</strong> doit être récupérée au poste de surveillance. Vous pouvez l'annuler tant qu'elle n'a pas été validée.
            </p>
            <div id="messageZone" class="hidden text-sm rounded-lg p-3"></div>
            <div id="listeEmprunts" class="space-y-3">
                <p class="text-sm text-slate-500 italic">Chargement...</p>
            </div>
        </div>
    </div>

    <script>
        const delegue = exigerSession('DELEGUE');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sousTitre').textContent = `${delegue.nom} — ${delegue.filiereNiveau}`;
            chargerEmprunts();
        });

        async function chargerEmprunts() {
            const conteneur = document.getElementById('listeEmprunts');
            let result;
            try {
                result = await appelApi(`/emprunts/delegue/${delegue.id}`);
            } catch (e) {
                conteneur.innerHTML = '<p class="text-sm text-red-600">Erreur de connexion au serveur.</p>';
                return;
            }

            const emprunts = result.success ? result.data : [];
            conteneur.innerHTML = '';

            if (emprunts.length === 0) {
                conteneur.innerHTML = '<p class="text-sm text-slate-500 italic py-6 text-center">Aucune demande pour le moment. <a href="demande-emprunt.html" class="text-blue-600 underline">Faire une demande</a>.</p>';
                return;
            }

            emprunts.forEach(e => {
                const statut = statutFiche(e);
                const heurePrevue = formaterHeure(e.heureRetourPrevue);
                const carte = document.createElement('div');
                carte.className = 'border border-slate-200 rounded-lg p-4 text-sm space-y-2';
                carte.innerHTML = `
                    <div class="flex justify-between items-start gap-3">
                        <div>
                            <div class="font-semibold text-slate-800">Salle ${echapper(e.salle)}</div>
                            <div class="text-xs text-slate-500">
                                Demandé le ${formaterDate(e.dateSortie)}${heurePrevue ? ` · retour prévu à ${heurePrevue}` : ''}
                            </div>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ${statut.classe}">${statut.texte}</span>
                    </div>
                    <div class="text-xs text-slate-700">${listeArticlesHtml(e)}</div>
                    ${e.dateRetour ? `<div class="text-xs text-slate-400">Rendu le ${formaterDate(e.dateRetour)}${e.observations ? ' — ' + echapper(e.observations) : ''}</div>` : ''}
                    ${e.statutEmprunt === 'EN_ATTENTE' ? `
                        <div class="flex justify-end">
                            <button data-id="${e.id}" class="btn-annuler px-3 py-1.5 text-xs font-medium rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Annuler la demande</button>
                        </div>` : ''}
                `;
                conteneur.appendChild(carte);
            });

            conteneur.querySelectorAll('.btn-annuler').forEach(btn => {
                btn.addEventListener('click', () => annuler(parseInt(btn.dataset.id)));
            });
        }

        async function annuler(empruntId) {
            if (!confirm('Annuler cette demande ?')) return;
            try {
                const result = await appelApi(`/emprunts/${empruntId}/annuler`, {
                    method: 'POST', body: { delegueId: delegue.id }
                });
                afficherMessage('messageZone', result.message, result.success);
            } catch (e) {
                afficherMessage('messageZone', 'Erreur de connexion au serveur.', false);
            }
            chargerEmprunts();
        }
    </script>
</body>
</html>
