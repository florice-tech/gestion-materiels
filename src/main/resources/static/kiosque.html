<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Écran du poste - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        /* Écran toujours sombre : lisible de loin, sur une télé ou une tablette posée au poste */
        body.kiosque { background: #0d1828 !important; color: #e4e9f2; min-height: 100vh; }
        .kiosque .panneau { background: #142339; border: 1px solid #22385a; border-radius: 1rem; }
        .kiosque .titre-panneau { color: #9fb3d1; font-size: clamp(.9rem, 1.1vw, 1.15rem); font-weight: 600; }
        .kiosque .ligne { border-top: 1px solid #1f3352; }
        .kiosque .horloge { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(2.6rem, 5vw, 5rem); line-height: 1; font-weight: 700; letter-spacing: -.02em; }
        .kiosque .grand { font-size: clamp(1rem, 1.35vw, 1.4rem); }
        .kiosque .moyen { font-size: clamp(.85rem, 1vw, 1.05rem); }
        .kiosque .retard { background: #3a1820; border-color: #7a2a36; }
        .kiosque .qr-kiosque img, .kiosque .qr-kiosque canvas { width: 100% !important; height: auto !important; }
        .defile { display: flex; gap: 2.5rem; white-space: nowrap; animation: defiler 40s linear infinite; }
        @keyframes defiler { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @media (prefers-reduced-motion: reduce) { .defile { animation: none; flex-wrap: wrap; white-space: normal; } }
    </style>
</head>
<body class="kiosque font-sans">
    <main class="p-4 md:p-6 lg:p-8 min-h-screen flex flex-col gap-5">
        <header class="flex flex-wrap items-center gap-5">
            <div class="flex items-center gap-4 flex-1 min-w-[260px]">
                <span id="logo"></span>
                <div>
                    <div class="text-white font-semibold grand">Poste de surveillance</div>
                    <div class="moyen" style="color:#9fb3d1">Lomé Business School · emprunts de matériel</div>
                </div>
            </div>
            <div class="text-right">
                <div id="horloge" class="horloge text-white">--:--</div>
                <div id="date" class="moyen first-letter:uppercase" style="color:#9fb3d1"></div>
            </div>
            <button id="btnPleinEcran" class="text-xs px-3 py-2 rounded-lg" style="background:#1f3352;color:#c9d6ea">Plein écran</button>
        </header>

        <section id="chiffres" class="grid grid-cols-2 md:grid-cols-4 gap-4"></section>

        <div class="grid grid-cols-1 xl:grid-cols-[1.15fr_1fr_minmax(260px,20rem)] gap-5 flex-1">
            <section class="panneau p-5 flex flex-col min-h-0">
                <h2 class="titre-panneau mb-3">Matériel sorti en ce moment</h2>
                <div id="sortis" class="space-y-2 overflow-hidden"></div>
            </section>
            <section class="panneau p-5 flex flex-col min-h-0">
                <h2 class="titre-panneau mb-3">Aujourd'hui</h2>
                <div id="aujourdhui" class="space-y-2 overflow-hidden"></div>
            </section>
            <aside class="panneau p-5 flex flex-col items-center text-center gap-3">
                <h2 class="titre-panneau">Emprunter sans attendre</h2>
                <div id="qr" class="qr-kiosque bg-white p-3 rounded-xl w-full max-w-[16rem]"></div>
                <p class="grand text-white font-semibold">Scannez avec votre téléphone</p>
                <p class="moyen" style="color:#9fb3d1">Puis scannez le QR code collé sur le matériel pour le récupérer ou le rendre.</p>
            </aside>
        </div>

        <footer class="panneau px-5 py-3 overflow-hidden">
            <div class="flex items-center gap-4">
                <span class="moyen font-semibold shrink-0" style="color:#8fe0ad">Disponible maintenant</span>
                <div class="overflow-hidden flex-1"><div id="defile" class="defile moyen"></div></div>
            </div>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'kiosque' });
            document.getElementById('logo').innerHTML = logoHtml('h-12');
            document.getElementById('btnPleinEcran').addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
            });
            const base = await adresseQr();
            const zoneQr = document.getElementById('qr');
            await chargerBibliothequeQr();
            if (window.QRCode) new QRCode(zoneQr, { text: `${base}/scan.html`, width: 512, height: 512, colorDark: '#152a49', colorLight: '#ffffff' });
            horloge(); setInterval(horloge, 1000);
            charger(); setInterval(charger, 20000);
        });

        function horloge() {
            const d = new Date();
            document.getElementById('horloge').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        }

        async function charger() {
            const [t, materiels] = await Promise.all([appelApi('/statistiques'), appelApi('/materiels')]);
            if (!t || !t.compteurs) return;
            const libres = (Array.isArray(materiels) ? materiels : []).filter(m => m.typeGestion === 'DURABLE' && m.statut === 'DISPONIBLE');
            afficherChiffres(t.compteurs, libres.length);
            afficherSortis(t.enCirculation);
            afficherAujourdhui(t.reservationsDuJour, t.demandesATraiter, t.compteurs.demandesEnAttente);
            const puces = libres.map(m => `<span><span style="color:#8fe0ad">●</span> ${echapper(m.designation)} <span style="color:#7f8ca3">${echapper(m.codeUnique)}</span></span>`).join('');
            document.getElementById('defile').innerHTML = libres.length ? puces + puces : '<span style="color:#9fb3d1">Tout le matériel est sorti pour le moment.</span>';
        }

        function afficherChiffres(c, libres) {
            const chiffre = (libelle, valeur, alerte) => `
                <div class="panneau ${alerte ? 'retard' : ''} p-4">
                    <div class="moyen" style="color:${alerte ? '#ffb4bb' : '#9fb3d1'}">${libelle}</div>
                    <div class="font-bold text-white" style="font-size:clamp(2rem,3.4vw,3.4rem);line-height:1.1">${valeur}</div>
                </div>`;
            document.getElementById('chiffres').innerHTML =
                chiffre('Disponibles', libres) + chiffre('Sortis', c.materielsSortis) +
                chiffre('En retard', c.empruntsEnRetard, c.empruntsEnRetard > 0) + chiffre('Demandes à remettre', c.demandesEnAttente);
        }

        function afficherSortis(sorties) {
            const zone = document.getElementById('sortis');
            if (!sorties.length) { zone.innerHTML = `<p class="grand py-10 text-center" style="color:#9fb3d1">Tout le matériel est rentré.</p>`; return; }
            const triees = [...sorties].sort((a, b) => (b.enRetard - a.enRetard) || (a.retourPrevu || '99').localeCompare(b.retourPrevu || '99'));
            zone.innerHTML = triees.slice(0, 9).map(s => {
                const r = tempsRestant(s.retourPrevu ? `${s.depuis.substring(0, 10)}T${s.retourPrevu}` : null);
                const retard = s.enRetard || r.retard;
                return `<div class="p-3 rounded-xl border ${retard ? 'retard' : ''}" style="${retard ? '' : 'border-color:#1f3352'}">
                    <div class="flex items-baseline justify-between gap-3">
                        <div class="grand font-semibold text-white leading-tight">${echapper(s.designation)}</div>
                        <div class="grand font-semibold shrink-0 ${retard ? '' : 'text-white'}" style="${retard ? 'color:#ff9ca4' : ''}">${s.retourPrevu ? formaterHeure(s.retourPrevu) : '—'}</div>
                    </div>
                    <div class="flex items-baseline justify-between gap-3 mt-0.5">
                        <div class="moyen min-w-0 truncate" style="color:#9fb3d1">${echapper(s.delegue)} · salle ${echapper(s.salle)}</div>
                        <div class="moyen shrink-0" style="color:${retard ? '#ff9ca4' : r.bientot ? '#f3cf7a' : '#7f8ca3'}">${retard && !r.retard ? 'en retard' : r.texte}</div>
                    </div>
                </div>`;
            }).join('') + (triees.length > 9 ? `<p class="moyen text-center pt-1" style="color:#7f8ca3">et ${pluriel(triees.length - 9, 'autre')}</p>` : '');
        }

        function afficherAujourdhui(reservations, demandes, totalDemandes) {
            const zone = document.getElementById('aujourdhui');
            const maintenant = new Date().toTimeString().substring(0, 5);
            const aVenir = reservations.filter(e => (e.heureRetourPrevue || '23:59') > maintenant);
            let html = aVenir.map(e => {
                const enCours = e.heureDebut.substring(0, 5) <= maintenant;
                return `<div class="flex items-center gap-4 p-3 rounded-xl border" style="border-color:${enCours ? '#3a6296' : '#1f3352'}">
                    <div class="text-center shrink-0 w-20"><div class="grand font-bold text-white">${formaterHeure(e.heureDebut)}</div><div class="moyen" style="color:#7f8ca3">${formaterHeure(e.heureRetourPrevue)}</div></div>
                    <div class="min-w-0 flex-1">
                        <div class="grand font-semibold text-white truncate">${echapper(e.delegue.nom)} · salle ${echapper(e.salle)}</div>
                        <div class="moyen truncate" style="color:#9fb3d1">${echapper(resumeArticles(e.details))}</div>
                    </div>
                    <span class="moyen shrink-0 px-2 py-1 rounded-lg" style="background:${enCours ? '#22406e' : '#1f3352'};color:#c9d6ea">${enCours ? 'à retirer' : 'réservé'}</span>
                </div>`;
            }).join('');
            if (totalDemandes) {
                html += `<div class="p-3 rounded-xl border" style="border-color:#6b5420;background:#2a2312">
                    <div class="grand font-semibold" style="color:#f3cf7a">${pluriel(totalDemandes, 'demande', 'demandes')} à remettre au poste</div>
                    <div class="moyen" style="color:#d9c48a">${demandes.slice(0, 3).map(e => echapper(e.delegue.nom)).join(', ')}${totalDemandes > 3 ? '…' : ''}</div>
                </div>`;
            }
            zone.innerHTML = html || `<p class="grand py-10 text-center" style="color:#9fb3d1">Aucune réservation pour le reste de la journée.</p>`;
        }
    </script>
</body>
</html>
