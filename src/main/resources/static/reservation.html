<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Réserver à l'avance - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .frise { position: relative; height: 1.6rem; border-radius: .4rem; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 13 - 1px), var(--ligne) calc(100% / 13 - 1px) calc(100% / 13)); background-color: color-mix(in srgb, var(--fond) 70%, transparent); overflow: hidden; }
        .frise .bloc { position: absolute; top: .2rem; bottom: .2rem; border-radius: .3rem; }
        .frise .choix { position: absolute; top: 0; bottom: 0; border: 2px dashed #22406e; border-radius: .4rem; background: rgba(34, 64, 110, .08); }
        html.dark .frise .choix { border-color: #9fbcf0; background: rgba(159, 188, 240, .12); }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-5">
        <div>
            <h1 class="text-2xl md:text-3xl text-slate-800">Réserver à l'avance</h1>
            <p class="text-sm text-slate-500 mt-1">Choisissez le jour et le créneau : vous voyez ce qui est déjà pris. Le jour venu, scannez le matériel ou passez au poste pour le retirer.</p>
        </div>

        <form id="formReservation" class="space-y-5">
            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="col-span-2 md:col-span-1"><label for="jour" class="block text-sm font-medium text-slate-700 mb-1">Jour</label>
                    <input id="jour" type="date" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg"></div>
                <div><label for="debut" class="block text-sm font-medium text-slate-700 mb-1">De</label>
                    <input id="debut" type="time" required value="08:00" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg"></div>
                <div><label for="fin" class="block text-sm font-medium text-slate-700 mb-1">À</label>
                    <input id="fin" type="time" required value="10:00" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg"></div>
                <div class="col-span-2 md:col-span-1"><label for="salle" class="block text-sm font-medium text-slate-700 mb-1">Salle</label>
                    <select id="salle" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg"></select></div>
            </section>

            <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
                <div class="flex flex-wrap items-baseline justify-between gap-2">
                    <h2 id="titreDispo" class="font-semibold text-slate-800 text-lg">Disponibilités</h2>
                    <div class="flex flex-wrap gap-3 text-xs text-slate-500">
                        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#5d82b2"></span>Réservé</span>
                        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#d99a2b"></span>Emprunté</span>
                        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-dashed" style="border-color:#22406e"></span>Votre créneau</span>
                    </div>
                </div>
                <div class="hidden sm:flex justify-between text-[11px] text-slate-400 pl-[42%] pr-1"><span>7h</span><span>10h</span><span>13h</span><span>16h</span><span>20h</span></div>
                <div id="listeDurables" class="divide-y divide-slate-100"></div>
                <div id="zoneConsommables"></div>
            </section>

            <div id="messageZone" class="hidden"></div>
            <div class="flex justify-end">
                <button id="btnReserver" class="bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold px-6 py-3 rounded-lg">Réserver</button>
            </div>
        </form>
    </main>

    <script>
        const HEURE_MIN = 7, HEURE_MAX = 20;
        let occupations = [], consommables = [];
        const choisis = new Set();

        const enMinutes = h => { const [a, b] = h.substring(0, 5).split(':').map(Number); return a * 60 + b; };
        const position = h => Math.min(100, Math.max(0, (enMinutes(h) - HEURE_MIN * 60) / ((HEURE_MAX - HEURE_MIN) * 60) * 100));

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'DELEGUE', page: 'reservation' });
            const demain = new Date(Date.now() + 86400000);
            const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const jour = document.getElementById('jour');
            jour.min = iso(new Date()); jour.max = iso(new Date(Date.now() + 60 * 86400000)); jour.value = iso(demain);
            const salles = await appelApi('/salles');
            document.getElementById('salle').innerHTML = '<option value="">Choisir</option>' +
                salles.map(s => `<option value="${echapper(s.nom)}">${echapper(s.nom)}</option>`).join('');
            consommables = (await appelApi('/materiels')).filter(m => m.typeGestion === 'CONSOMMABLE');
            afficherConsommables();
            ['jour'].forEach(id => document.getElementById(id).addEventListener('change', charger));
            ['debut', 'fin'].forEach(id => document.getElementById(id).addEventListener('change', afficher));
            document.getElementById('formReservation').addEventListener('submit', reserver);
            charger();
        });

        async function charger() {
            const jour = document.getElementById('jour').value;
            document.getElementById('titreDispo').textContent = 'Disponibilités du ' +
                new Date(jour + 'T00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
            occupations = await appelApi('/disponibilites?jour=' + jour);
            afficher();
        }

        function conflit(o) {
            const d = document.getElementById('debut').value, f = document.getElementById('fin').value;
            if (!d || !f) return null;
            return o.creneaux.find(c => enMinutes(c.debut) < enMinutes(f) && enMinutes(d) < enMinutes(c.fin || '23:59')) || null;
        }

        function afficher() {
            const d = document.getElementById('debut').value, f = document.getElementById('fin').value;
            const liste = document.getElementById('listeDurables');
            liste.innerHTML = occupations.map(o => {
                const m = o.materiel, horsService = m.statut === 'HS' || m.statut === 'MAINTENANCE';
                const c = conflit(o), bloque = horsService || !!c;
                if (bloque) choisis.delete(m.id);
                const blocs = o.creneaux.map(cr => `<span class="bloc" title="${echapper(cr.delegue)} · ${formaterHeure(cr.debut)}–${cr.fin ? formaterHeure(cr.fin) : 'fin de journée'}"
                    style="left:${position(cr.debut)}%;width:${Math.max(1.5, position(cr.fin || '23:59') - position(cr.debut))}%;background:${cr.type === 'RESERVATION' ? '#5d82b2' : '#d99a2b'}"></span>`).join('');
                const choix = d && f ? `<span class="choix" style="left:${position(d)}%;width:${Math.max(0, position(f) - position(d))}%"></span>` : '';
                const raison = horsService ? LABELS_STATUT_MATERIEL[m.statut].texte
                    : c ? `Pris de ${formaterHeure(c.debut)} à ${c.fin ? formaterHeure(c.fin) : 'la fin de journée'}` : 'Libre sur ce créneau';
                return `<label class="grid grid-cols-1 sm:grid-cols-[42%_1fr] items-center gap-2 py-3 ${bloque ? 'opacity-60' : 'cursor-pointer'}">
                    <span class="flex items-center gap-3 min-w-0">
                        <input type="checkbox" data-id="${m.id}" class="w-4 h-4 shrink-0" ${bloque ? 'disabled' : ''} ${choisis.has(m.id) ? 'checked' : ''}>
                        <span class="min-w-0"><span class="block text-sm font-medium text-slate-800 truncate">${echapper(m.designation)}</span>
                        <span class="block text-xs ${c || horsService ? 'text-red-700' : 'text-slate-500'}">${echapper(m.codeUnique)} · ${raison}</span></span>
                    </span>
                    <span class="frise" aria-hidden="true">${blocs}${choix}</span>
                </label>`;
            }).join('') || etatVide('Aucun matériel durable au catalogue.');
            liste.querySelectorAll('input[data-id]').forEach(el => el.addEventListener('change', () => {
                const id = parseInt(el.dataset.id);
                el.checked ? choisis.add(id) : choisis.delete(id);
            }));
        }

        function afficherConsommables() {
            if (!consommables.length) return;
            document.getElementById('zoneConsommables').innerHTML = `
                <h3 class="font-semibold text-slate-800 mt-2 mb-2">Fournitures</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${consommables.map(m => `
                    <label class="flex items-center justify-between gap-3 p-3 border border-slate-200 rounded-lg text-sm">
                        <span class="text-slate-800">${echapper(m.designation)} <span class="text-xs text-slate-500">(stock actuel : ${m.quantiteStock})</span></span>
                        <input type="number" min="0" max="${m.quantiteStock}" value="0" data-conso="${m.id}" class="w-16 text-center border border-slate-300 rounded py-1" aria-label="Quantité">
                    </label>`).join('')}</div>`;
        }

        async function reserver(e) {
            e.preventDefault();
            const articles = [...choisis].map(id => ({ materielId: id, quantite: 1 }));
            document.querySelectorAll('[data-conso]').forEach(el => {
                const q = parseInt(el.value || '0'); if (q > 0) articles.push({ materielId: parseInt(el.dataset.conso), quantite: q });
            });
            if (!articles.length) { afficherMessage('messageZone', 'Cochez au moins un matériel.', false); return; }
            const bouton = document.getElementById('btnReserver'); bouton.disabled = true;
            const r = await appelApi('/emprunts/reservation', { method: 'POST', body: {
                salle: document.getElementById('salle').value, jour: document.getElementById('jour').value,
                heureDebut: document.getElementById('debut').value, heureFin: document.getElementById('fin').value, articles } });
            bouton.disabled = false;
            afficherMessage('messageZone', r.message, r.success);
            if (r.success) { choisis.clear(); charger(); setTimeout(() => location.href = 'mes-emprunts.html', 1800); }
        }
    </script>
</body>
</html>
