<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandes en attente - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex flex-wrap items-end justify-between gap-2">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Demandes en attente</h1>
                <p class="text-sm text-slate-500">Vérifiez la demande, remettez le matériel puis validez. Un refus libère le matériel réservé.</p>
            </div>
            <button id="btnActualiser" class="text-sm text-blue-600 hover:underline font-medium">↻ Actualiser</button>
        </div>

        <div id="messageZone" class="hidden"></div>
        <div id="listeDemandes" class="space-y-3"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'AGENT', page: 'demandes' });
            document.getElementById('btnActualiser').addEventListener('click', chargerDemandes);
            chargerDemandes();
            setInterval(chargerDemandes, 30000);
        });

        async function chargerDemandes() {
            const resultat = await appelApi('/emprunts/en-attente');
            const demandes = resultat.success ? resultat.data : [];
            const conteneur = document.getElementById('listeDemandes');

            if (!demandes.length) {
                conteneur.innerHTML = `<div class="bg-white rounded-xl border border-slate-200">${etatVide('Aucune demande en attente.')}</div>`;
                return;
            }

            conteneur.innerHTML = '';
            demandes.forEach(d => {
                const heurePrevue = formaterHeure(d.heureRetourPrevue);
                const carte = document.createElement('div');
                carte.className = 'bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-col md:flex-row md:items-center gap-4';
                carte.innerHTML = `
                    <div class="flex-1 space-y-1 text-sm">
                        <div class="font-semibold text-slate-800 text-base">${echapper(d.delegue.nom)}
                            <span class="text-sm font-normal text-slate-500">— ${echapper(d.delegue.filiereNiveau)}</span>
                        </div>
                        <div class="text-xs text-slate-500">
                            Salle <span class="font-bold text-blue-600">${echapper(d.salle)}</span>
                            · demandé le ${formaterDate(d.dateDemande)}
                            ${heurePrevue ? `· retour prévu à <strong>${heurePrevue}</strong>` : '· pas d\'heure de retour indiquée'}
                        </div>
                        <div class="text-sm text-slate-700 pt-1">${listeArticlesHtml(d)}</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button data-action="refuser" class="px-3 py-2 text-sm font-medium rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Refuser</button>
                        <button data-action="valider" class="px-3 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700">Valider et remettre</button>
                    </div>`;
                carte.querySelector('[data-action=valider]').addEventListener('click', e => valider(d, e.target));
                carte.querySelector('[data-action=refuser]').addEventListener('click', () => refuser(d));
                conteneur.appendChild(carte);
            });
        }

        async function valider(demande, bouton) {
            bouton.disabled = true;
            const resultat = await appelApi(`/emprunts/${demande.id}/valider`, { method: 'POST' });
            afficherMessage('messageZone', resultat.message, resultat.success);
            chargerDemandes();
        }

        async function refuser(demande) {
            const saisie = await demanderFormulaire({
                titre: 'Refuser la demande',
                texte: `Demande de ${demande.delegue.nom} (salle ${demande.salle}). Le matériel réservé sera libéré.`,
                champs: [{ nom: 'motif', label: 'Motif (visible par le délégué, facultatif)', type: 'textarea' }],
                bouton: 'Refuser la demande',
                danger: true
            });
            if (!saisie) return;
            const resultat = await appelApi(`/emprunts/${demande.id}/refuser`, { method: 'POST', body: { motif: saisie.motif } });
            afficherMessage('messageZone', resultat.message, resultat.success);
            chargerDemandes();
        }
    </script>
</body>
</html>
