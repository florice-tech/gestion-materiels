<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandes en attente - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans p-6">

    <div class="max-w-5xl mx-auto space-y-6">

        <div class="bg-blue-600 p-4 rounded-xl text-white flex flex-wrap gap-3 justify-between items-center shadow-md">
            <div>
                <h1 class="text-xl font-bold">Demandes en attente</h1>
                <p id="sousTitre" class="text-blue-100 text-sm">Poste de Surveillance</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <a href="accueil-agent.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Accueil</a>
                <a href="retour.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Retours</a>
                <a href="materiel.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Catalogue</a>
                <a href="historique.html" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium transition">Historique</a>
            </div>
        </div>

        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <p class="text-sm text-slate-600">
                    Vérifiez la demande, remettez le matériel au délégué puis cliquez sur <strong>Valider et remettre</strong>.
                    Un refus libère immédiatement le matériel réservé.
                </p>
                <button id="btnActualiser" class="text-xs text-blue-600 hover:underline font-medium whitespace-nowrap ml-4">↻ Actualiser</button>
            </div>

            <div id="messageZone" class="hidden text-sm rounded-lg p-3"></div>

            <div id="listeDemandes" class="space-y-3">
                <p class="text-sm text-slate-500 italic">Chargement...</p>
            </div>
        </div>
    </div>

    <script>
        const agent = exigerSession('AGENT');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sousTitre').textContent = `Agent connecté : ${agent.nom} (${agent.role})`;
            document.getElementById('btnActualiser').addEventListener('click', chargerDemandes);
            chargerDemandes();
        });

        async function chargerDemandes() {
            const conteneur = document.getElementById('listeDemandes');
            let result;
            try {
                result = await appelApi('/emprunts/en-attente');
            } catch (e) {
                conteneur.innerHTML = '<p class="text-sm text-red-600">Erreur de connexion au serveur.</p>';
                return;
            }

            const demandes = result.success ? result.data : [];
            conteneur.innerHTML = '';

            if (demandes.length === 0) {
                conteneur.innerHTML = '<p class="text-sm text-slate-500 italic py-6 text-center">Aucune demande en attente.</p>';
                return;
            }

            demandes.forEach(d => {
                const heurePrevue = formaterHeure(d.heureRetourPrevue);
                const carte = document.createElement('div');
                carte.className = 'border border-slate-200 rounded-lg p-4 flex flex-col md:flex-row md:items-center gap-4';
                carte.innerHTML = `
                    <div class="flex-1 space-y-1 text-sm">
                        <div class="font-semibold text-slate-800">${echapper(d.delegue.nom)}
                            <span class="text-xs font-normal text-slate-500">— ${echapper(d.delegue.filiereNiveau)}</span>
                        </div>
                        <div class="text-xs text-slate-500">
                            Salle <span class="font-bold text-blue-600">${echapper(d.salle)}</span>
                            · demandé le ${formaterDate(d.dateSortie)}
                            ${heurePrevue ? `· retour prévu à ${heurePrevue}` : ''}
                        </div>
                        <div class="text-xs text-slate-700 pt-1">${listeArticlesHtml(d)}</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button data-action="refuser" data-id="${d.id}"
                                class="px-3 py-2 text-xs font-medium rounded-lg border border-red-200 text-red-600 hover:bg-red-50">Refuser</button>
                        <button data-action="valider" data-id="${d.id}"
                                class="px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700">Valider et remettre</button>
                    </div>`;
                conteneur.appendChild(carte);
            });

            conteneur.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', () => traiter(btn.dataset.action, parseInt(btn.dataset.id), btn));
            });
        }

        async function traiter(action, empruntId, bouton) {
            if (action === 'refuser' && !confirm('Refuser cette demande ? Le matériel sera libéré.')) return;

            bouton.disabled = true;
            try {
                const result = action === 'valider'
                    ? await appelApi('/emprunts/valider', { method: 'POST', body: { empruntId, agentSortieId: agent.id } })
                    : await appelApi(`/emprunts/${empruntId}/refuser`, { method: 'POST' });
                afficherMessage('messageZone', result.message, result.success);
            } catch (e) {
                afficherMessage('messageZone', 'Erreur de connexion au serveur.', false);
            }
            chargerDemandes();
        }
    </script>
</body>
</html>
