<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Créer un compte - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        <div class="bg-blue-600 px-6 py-5 text-white text-center">
            <div id="logo" class="flex justify-center mb-3"></div>
            <h1 class="text-xl font-bold">Créer un compte délégué</h1>
            <p class="text-blue-100 text-sm mt-1">Pour demander des emprunts de matériel</p>
        </div>

        <form id="formInscription" class="p-6 space-y-4">
            <div>
                <label for="nom" class="block text-sm font-medium text-slate-700 mb-1">Nom complet</label>
                <input type="text" id="nom" placeholder="Nom Prénom" required maxlength="100"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label for="filiereNiveau" class="block text-sm font-medium text-slate-700 mb-1">Filière & niveau</label>
                <input type="text" id="filiereNiveau" placeholder="ex : L2 Systèmes d'Information" required maxlength="100"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label for="identifiant" class="block text-sm font-medium text-slate-700 mb-1">Identifiant souhaité</label>
                <input type="text" id="identifiant" placeholder="ex : pkodjo" required pattern="[A-Za-z0-9._\-]{3,50}" autocomplete="username"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <p class="text-xs text-slate-400 mt-1">3 à 50 caractères : lettres, chiffres, point, tiret, souligné.</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="motDePasse" class="block text-sm font-medium text-slate-700 mb-1">Mot de passe</label>
                    <input type="password" id="motDePasse" required minlength="6" autocomplete="new-password"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label for="confirmation" class="block text-sm font-medium text-slate-700 mb-1">Confirmation</label>
                    <input type="password" id="confirmation" required minlength="6" autocomplete="new-password"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            <p class="text-xs text-slate-400 -mt-2">6 caractères minimum.</p>

            <div id="messageZone" class="hidden"></div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">
                Créer mon compte
            </button>
            <p class="text-center text-sm text-slate-500">
                Déjà un compte ? <a href="login.html" class="text-blue-600 hover:underline font-medium">Se connecter</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('logo').innerHTML = logoHtml('h-12');
        document.getElementById('formInscription').addEventListener('submit', async (e) => {
            e.preventDefault();
            const motDePasse = document.getElementById('motDePasse').value;
            if (motDePasse !== document.getElementById('confirmation').value) {
                afficherMessage('messageZone', 'Les deux mots de passe ne sont pas identiques.', false);
                return;
            }
            const resultat = await appelApi('/auth/inscription', {
                method: 'POST',
                sansRedirection: true,
                body: {
                    nom: document.getElementById('nom').value.trim(),
                    filiereNiveau: document.getElementById('filiereNiveau').value.trim(),
                    identifiant: document.getElementById('identifiant').value.trim(),
                    motDePasse
                }
            });
            afficherMessage('messageZone', resultat.message, resultat.success);
            if (resultat.success) {
                setTimeout(() => window.location.href = 'login.html', 1500);
            }
        });
    </script>
</body>
</html>
