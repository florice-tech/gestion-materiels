<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-lbs-icone.png">
    <title>Nouvelle demande - Gestion Matériel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/commun.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen">
    <div id="entete"></div>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <h1 class="text-2xl md:text-3xl text-slate-800">Nouvelle demande d'emprunt</h1>

        <form id="demandeForm" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="salle" class="block text-sm font-medium text-slate-700 mb-1">Salle de cours</label>
                    <select id="salle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
                </div>
                <div>
                    <label for="heureRetourPrevue" class="block text-sm font-medium text-slate-700 mb-1">Heure de retour prévue</label>
                    <input type="time" id="heureRetourPrevue" required
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">Le matériel est à rendre le jour même, avant cette heure.</p>
                </div>
            </div>

            <hr class="border-slate-200">

            <div class="space-y-3">
                <div class="flex flex-wrap justify-between items-center gap-2">
                    <h2 class="font-semibold text-slate-800">Matériel disponible</h2>
                    <input id="recherche" type="search" placeholder="Rechercher..." class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                </div>
                <div id="listeMateriel" class="space-y-4"></div>
            </div>

            <div id="recapitulatif" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-900"></div>
            <div id="messageZone" class="hidden"></div>

            <div class="flex justify-end">
                <button type="submit" id="btnEnvoyer" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 disabled:opacity-60 shadow-sm">
                    Envoyer la demande
                </button>
            </div>
        </form>
    </main>

    <script>
        let materiels = [];
        const selection = new Map(); // materielId -> quantité (conservée quand on filtre)

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage({ type: 'DELEGUE', page: 'demande' });
            document.getElementById('demandeForm').addEventListener('submit', soumettre);
            document.getElementById('recherche').addEventListener('input', afficherMateriel);
            chargerSalles();
            chargerMateriel();
        });

        async function chargerSalles() {
            const salles = await appelApi('/salles');
            document.getElementById('salle').innerHTML = '<option value="">Sélectionner une salle</option>' +
                salles.map(s => `<option value="${echapper(s.nom)}">${echapper(s.nom)}</option>`).join('');
        }

        async function chargerMateriel() {
            materiels = await appelApi('/materiels');
            afficherMateriel();
        }

        function estDisponible(m) {
            return m.typeGestion === 'DURABLE' ? m.statut === 'DISPONIBLE' : m.quantiteStock > 0;
        }

        function afficherMateriel() {
            const texte = document.getElementById('recherche').value.toLowerCase().trim();
            const liste = materiels.filter(m => !texte || m.designation.toLowerCase().includes(texte));
            const conteneur = document.getElementById('listeMateriel');
            if (!liste.length) { conteneur.innerHTML = etatVide('Aucun matériel.'); return; }

            // Regroupement par catégorie
            const groupes = {};
            liste.forEach(m => (groupes[m.categorie.nom] = groupes[m.categorie.nom] || []).push(m));

            conteneur.innerHTML = Object.keys(groupes).sort().map(nom => `
                <div>
                    <h3 class="text-sm font-semibold text-slate-600 mb-2">${echapper(nom.charAt(0) + nom.slice(1).toLowerCase())}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">${groupes[nom].map(ligneMateriel).join('')}</div>
                </div>`).join('');

            conteneur.querySelectorAll('input[data-id]').forEach(el => el.addEventListener('input', () => {
                const id = parseInt(el.dataset.id);
                const quantite = el.type === 'checkbox' ? (el.checked ? 1 : 0) : parseInt(el.value || '0');
                if (quantite > 0) selection.set(id, quantite); else selection.delete(id);
                afficherRecapitulatif();
            }));
            afficherRecapitulatif();
        }

        function ligneMateriel(m) {
            const dispo = estDisponible(m);
            const choisi = selection.get(m.id) || 0;
            const classe = `flex justify-between items-center gap-3 p-3 border rounded-lg text-sm ${dispo ? 'border-slate-200 hover:bg-slate-50' : 'border-slate-100 bg-slate-50 opacity-60'}`;
            if (m.typeGestion === 'DURABLE') {
                return `<label class="${classe} ${dispo ? 'cursor-pointer' : ''}">
                    <span class="font-medium text-slate-700">${echapper(m.designation)}
                        ${dispo ? '' : `<span class="text-xs text-slate-400">(${LABELS_STATUT_MATERIEL[m.statut].texte.toLowerCase()})</span>`}</span>
                    <input type="checkbox" data-id="${m.id}" class="w-4 h-4" ${dispo ? '' : 'disabled'} ${choisi ? 'checked' : ''}>
                </label>`;
            }
            return `<label class="${classe}">
                <span class="font-medium text-slate-700">${echapper(m.designation)} <span class="text-xs text-slate-400">(stock : ${m.quantiteStock})</span></span>
                <input type="number" min="0" max="${m.quantiteStock}" value="${choisi}" data-id="${m.id}" aria-label="Quantité"
                       class="w-16 text-center border border-slate-300 rounded py-1" ${dispo ? '' : 'disabled'}>
            </label>`;
        }

        function afficherRecapitulatif() {
            const zone = document.getElementById('recapitulatif');
            if (!selection.size) { zone.classList.add('hidden'); return; }
            const lignes = [...selection].map(([id, qte]) => {
                const m = materiels.find(x => x.id === id);
                return m ? `${echapper(m.designation)}${m.typeGestion === 'CONSOMMABLE' ? ' × ' + qte : ''}` : '';
            });
            zone.innerHTML = `<strong>Votre sélection :</strong> ${lignes.join(', ')}`;
            zone.classList.remove('hidden');
        }

        async function soumettre(e) {
            e.preventDefault();
            if (!selection.size) {
                afficherMessage('messageZone', 'Sélectionnez au moins un matériel.', false);
                return;
            }
            const bouton = document.getElementById('btnEnvoyer');
            bouton.disabled = true;
            const resultat = await appelApi('/emprunts/demande', {
                method: 'POST',
                body: {
                    salle: document.getElementById('salle').value,
                    heureRetourPrevue: document.getElementById('heureRetourPrevue').value || null,
                    articles: [...selection].map(([materielId, quantite]) => ({ materielId, quantite }))
                }
            });
            bouton.disabled = false;
            afficherMessage('messageZone', resultat.message, resultat.success);
            if (resultat.success) {
                selection.clear();
                e.target.reset();
                chargerMateriel();
                setTimeout(() => window.location.href = 'mes-emprunts.html', 2000);
            }
        }
    </script>
</body>
</html>
