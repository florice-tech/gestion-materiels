spring.application.name=gestion-materiels

# ---------- Base PostgreSQL ----------
# Valeurs par défaut modifiables par variables d'environnement : DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_materiels_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- Schéma géré par Flyway (src/main/resources/db/migration) ----------
spring.flyway.enabled=true
# Base créée par l'ancienne version (tables déjà présentes, sans historique Flyway) :
# on l'adopte au niveau 0 puis on applique V1 (sans effet sur l'existant) et V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate vérifie seulement que les entités correspondent au schéma, il ne le modifie plus
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Session ----------
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
