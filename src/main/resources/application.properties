spring.application.name=gestion-materiels

# PostgreSQL (valeurs par défaut modifiables par variables d'environnement DB_URL / DB_USER / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_materiels_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
